<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="KEYSTONE">
<title>KEYSTONE — 宅建士</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Crect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%23171b27%22/%3E%3Cpath d=%22M30 75V45l20-18 20 18v30H58V58H42v17z%22 fill=%22%236d87c4%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@200;300;400;500;600&family=Noto+Sans+JP:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#fafafb; --surface:#ffffff; --surface2:#f2f3f6; --border:#e3e5ec; --border-soft:#eff0f4;
  --text:#171b27; --text-dim:#596075; --text-muted:#9ba1b1;
  --hdr-bg:#171b27; --hdr-text:#eef0f6; --hdr-dim:#80879a;
  /* Accent — 藍（宅建） */
  --accent:#34508f; --accent-soft:#6d87c4; --accent-bg:#eef2fa;
  --green:#2f9e63; --green-bg:#eef8f1; --red:#cf4d47; --red-bg:#fbf2f1;
  --blue:#3d78b0; --blue-bg:#eef4fa; --amber:#c08a1e; --amber-bg:#fdf6e8;
  /* 分野色 */
  --f-kenri:#7a4fa0; --f-kenri-bg:#f4effa;
  --f-gyoho:#34508f; --f-gyoho-bg:#eef2fa;
  --f-horei:#2f8a6e; --f-horei-bg:#edf7f3;
  --f-zei:#b5741c;   --f-zei-bg:#fcf4e8;
  --r:7px;
}
body{ background:var(--bg); color:var(--text); font-family:'Noto Sans JP','DM Sans',system-ui,sans-serif; font-size:14px; line-height:1.75; height:100dvh; display:flex; flex-direction:column; overflow:hidden; }
button{ font-family:inherit; }

/* ══════════ HEADER ══════════ */
#hdr{ flex-shrink:0; background:var(--hdr-bg); padding-top:env(safe-area-inset-top); }
.hdr-main{ display:flex; align-items:center; justify-content:space-between; padding:16px 0 16px 24px; gap:12px; }
.hdr-title-block{ display:flex; flex-direction:column; gap:7px; min-width:0; cursor:pointer; }
.hdr-title{ font-family:'DM Sans',sans-serif; font-weight:200; font-size:24px; letter-spacing:.42em; color:var(--hdr-text); text-indent:.42em; line-height:1; }
.hdr-sub-inline{ font-family:'DM Sans',sans-serif; font-weight:300; font-size:10px; letter-spacing:.28em; color:var(--hdr-text); text-indent:.28em; line-height:1; opacity:.62; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.hdr-actions{ display:flex; align-items:center; gap:8px; flex-shrink:0; padding-right:16px; }
.hdr-icon-btn{ background:none; border:1px solid rgba(238,240,246,.22); color:rgba(238,240,246,.75); height:32px; padding:0 12px; border-radius:5px; cursor:pointer; font-size:11px; display:flex; align-items:center; gap:5px; transition:all .15s; -webkit-tap-highlight-color:transparent; }
.hdr-icon-btn:hover{ background:rgba(238,240,246,.08); color:var(--hdr-text); }
@media (max-width:640px){ .hdr-icon-btn .t{ display:none; } .hdr-main{ padding-left:16px; } .hdr-title{ font-size:20px; } }

/* ══════════ LAYOUT ══════════ */
#app{ flex:1; display:flex; overflow:hidden; position:relative; }
#sb{ width:300px; flex-shrink:0; background:var(--surface); border-right:1px solid var(--border); display:flex; flex-direction:column; overflow:hidden; }
.sb-scroll{ flex:1; overflow-y:auto; padding:6px 0 24px; }
.sb-nav{ padding:12px 12px 10px; border-bottom:1px solid var(--border); display:grid; grid-template-columns:1fr 1fr; gap:6px; }
.navbtn{ display:flex; align-items:center; gap:7px; padding:8px 10px; border:1px solid var(--border); border-radius:var(--r); background:var(--surface2); color:var(--text-dim); font-size:12px; cursor:pointer; text-align:left; -webkit-tap-highlight-color:transparent; transition:all .12s; }
.navbtn:hover{ border-color:var(--accent-soft); color:var(--accent); }
.navbtn.on{ background:var(--accent); border-color:var(--accent); color:#fff; }
.grp-lbl{ padding:14px 20px 4px; font-size:10px; font-weight:700; letter-spacing:.12em; display:flex; align-items:center; gap:6px; }
.grp-lbl .gn{ margin-left:auto; color:var(--text-muted); font-weight:500; letter-spacing:.02em; }
.ubtn{ display:flex; align-items:center; width:100%; padding:6px 20px; gap:9px; background:none; border:none; cursor:pointer; color:var(--text-dim); font-size:12.5px; text-align:left; transition:background .1s; -webkit-tap-highlight-color:transparent; border-left:3px solid transparent; }
.ubtn:hover{ background:var(--surface2); color:var(--text); }
.ubtn.active{ background:var(--accent-bg); color:var(--accent); border-left-color:var(--accent); font-weight:500; }
.ubtn .uicon{ font-size:15px; width:20px; text-align:center; flex-shrink:0; }
.ubtn .utxt{ flex:1; min-width:0; display:flex; flex-direction:column; line-height:1.3; }
.ubtn .ut-main{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.ubtn .ut-sub{ font-size:10px; color:var(--text-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.umeter{ width:34px; flex-shrink:0; font-size:10px; color:var(--text-muted); text-align:right; font-family:'DM Sans',sans-serif; }
.umeter.good{ color:var(--green); font-weight:600; }

#main{ flex:1; display:flex; flex-direction:column; overflow:hidden; background:var(--bg); min-width:0; }
#crumb{ display:none; flex-shrink:0; align-items:center; gap:10px; padding:10px 16px; background:var(--surface); border-bottom:1px solid var(--border); }
#crumb .back{ color:var(--accent); font-size:13px; cursor:pointer; background:none; border:none; padding:4px 0; }
#crumb .ct{ font-size:13px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
#content{ flex:1; overflow-y:auto; padding:34px 48px 96px; -webkit-overflow-scrolling:touch; }
@media (max-width:640px){
  #sb{ width:100%; position:absolute; inset:0; z-index:10; border-right:none; }
  body.in-content #sb{ display:none; }
  body:not(.in-content) #main{ display:none; }
  #crumb{ display:flex; }
  #content{ padding:20px 16px 96px; }
}

/* ══════════ 共通部品 ══════════ */
h2.pg{ font-size:19px; font-weight:600; margin-bottom:6px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.pg-sub{ color:var(--text-muted); font-size:12.5px; margin-bottom:22px; }
.sec-h{ font-size:11px; font-weight:700; color:var(--accent); margin:28px 0 12px; letter-spacing:.1em; display:flex; align-items:center; gap:8px; }
.sec-h::before{ content:""; width:16px; height:2px; background:var(--accent); border-radius:2px; }
.wrap{ max-width:760px; }
.btn{ display:inline-flex; align-items:center; gap:6px; padding:9px 18px; border-radius:var(--r); border:1px solid var(--border); background:var(--surface); color:var(--text-dim); font-size:12.5px; cursor:pointer; transition:all .15s; white-space:nowrap; -webkit-tap-highlight-color:transparent; }
.btn:hover{ border-color:var(--accent); color:var(--accent); }
.btn:disabled{ opacity:.4; cursor:default; }
.btn.p{ background:var(--hdr-bg); border-color:var(--hdr-bg); color:var(--hdr-text); font-weight:500; }
.btn.p:hover{ background:var(--accent); border-color:var(--accent); color:#fff; }
.btn.sm{ padding:6px 12px; font-size:11.5px; }
.btn.danger:hover{ border-color:var(--red); color:var(--red); }
.row{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
.chip{ display:inline-flex; align-items:center; gap:4px; font-size:10px; font-weight:700; padding:2px 8px; border-radius:4px; letter-spacing:.03em; white-space:nowrap; }
.chip.kenri{ background:var(--f-kenri-bg); color:var(--f-kenri); }
.chip.gyoho{ background:var(--f-gyoho-bg); color:var(--f-gyoho); }
.chip.horei{ background:var(--f-horei-bg); color:var(--f-horei); }
.chip.zei{ background:var(--f-zei-bg); color:var(--f-zei); }
.chip.gray{ background:var(--surface2); color:var(--text-muted); }
.chip.imp{ background:var(--amber-bg); color:#8a6510; }
.empty{ background:var(--surface); border:1px dashed var(--border); border-radius:var(--r); padding:22px; color:var(--text-muted); font-size:13px; text-align:center; line-height:1.9; }
.seg{ display:inline-flex; border:1px solid var(--border); border-radius:var(--r); overflow:hidden; background:var(--surface); }
.seg button{ border:none; background:none; padding:7px 13px; font-size:12px; color:var(--text-dim); cursor:pointer; border-right:1px solid var(--border); }
.seg button:last-child{ border-right:none; }
.seg button.on{ background:var(--accent); color:#fff; }

/* ══════════ HOME ══════════ */
.hero{ background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:20px 22px; margin-bottom:22px; display:grid; grid-template-columns:repeat(4,1fr); gap:14px; }
@media (max-width:640px){ .hero{ grid-template-columns:repeat(2,1fr); } }
.kpi .k-l{ font-size:10.5px; color:var(--text-muted); letter-spacing:.04em; }
.kpi .k-v{ font-family:'DM Sans',sans-serif; font-size:26px; font-weight:300; color:var(--text); line-height:1.25; }
.kpi .k-v small{ font-size:12px; color:var(--text-muted); margin-left:2px; }
.mode-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:12px; }
.mode-card{ text-align:left; background:var(--surface); border:1px solid var(--border); border-radius:var(--r); padding:16px 18px; cursor:pointer; transition:all .15s; -webkit-tap-highlight-color:transparent; }
.mode-card:hover:not(:disabled){ border-color:var(--accent); box-shadow:0 3px 12px rgba(52,80,143,.08); transform:translateY(-1px); }
.mode-card:disabled{ opacity:.5; cursor:default; }
.mode-ic{ font-size:22px; }
.mode-name{ font-size:14.5px; font-weight:600; color:var(--text); margin:6px 0 3px; }
.mode-desc{ font-size:11.5px; color:var(--text-muted); line-height:1.6; }
.fbars{ background:var(--surface); border:1px solid var(--border); border-radius:var(--r); padding:16px 18px; }
.fbar{ display:grid; grid-template-columns:110px 1fr 74px; gap:10px; align-items:center; margin:6px 0; font-size:12.5px; }
.fbar .tr{ height:9px; background:var(--surface2); border-radius:5px; overflow:hidden; }
.fbar .fl{ height:100%; border-radius:5px; }
.fbar .v{ text-align:right; font-family:'DM Sans',sans-serif; color:var(--text-dim); font-size:12px; }

/* ══════════ 解説 ══════════ */
.tabs{ display:flex; gap:0; border-bottom:1px solid var(--border); margin:4px 0 24px; overflow-x:auto; }
.tab{ padding:11px 18px; font-size:13px; color:var(--text-muted); cursor:pointer; border:none; background:none; border-bottom:2px solid transparent; white-space:nowrap; -webkit-tap-highlight-color:transparent; }
.tab.on{ color:var(--accent); border-bottom-color:var(--accent); font-weight:500; }
.gram{ max-width:780px; }
.gram h3{ font-size:12px; font-weight:700; color:var(--accent); margin:30px 0 14px; letter-spacing:.1em; display:flex; align-items:center; gap:8px; }
.gram h3::before{ content:""; width:16px; height:2px; background:var(--accent); border-radius:2px; }
.gram h3:first-child{ margin-top:0; }
.gram p{ color:var(--text-dim); margin-bottom:12px; font-size:14px; line-height:1.9; }
.gram strong{ color:var(--text); }
.gram ul,.gram ol{ margin:0 0 14px; padding-left:20px; }
.gram li{ color:var(--text-dim); margin-bottom:6px; line-height:1.85; }
.gram table{ width:100%; border-collapse:collapse; margin:12px 0 20px; font-size:13px; background:var(--surface); border:1px solid var(--border); }
.gram th{ text-align:left; padding:9px 12px; background:var(--surface2); color:var(--text-dim); font-size:11px; font-weight:600; border-bottom:1px solid var(--border); }
.gram td{ padding:9px 12px; border-bottom:1px solid var(--border-soft); color:var(--text); vertical-align:top; }
.gram td:first-child{ color:var(--accent); font-weight:500; }
.tblwrap{ overflow-x:auto; }
.hbox{ background:var(--accent-bg); border-left:3px solid var(--accent); padding:13px 17px; border-radius:0 var(--r) var(--r) 0; margin:12px 0 20px; font-size:13.5px; line-height:1.95; color:var(--text); }
.term{ color:var(--accent); font-weight:600; }
.wbox{ background:var(--amber-bg); border:1px solid #f0e2c0; border-radius:var(--r); padding:12px 16px; margin:12px 0; font-size:12.5px; color:#8a6510; line-height:1.85; }
.nbox{ background:var(--blue-bg); border:1px solid #d6e4f0; border-radius:var(--r); padding:12px 16px; margin:12px 0; font-size:12.5px; color:var(--blue); line-height:1.85; }
.diagram{ background:var(--surface); border:1px solid var(--border); border-radius:var(--r); padding:14px 16px; margin:12px 0 20px; font-family:ui-monospace,Menlo,'Noto Sans JP',monospace; font-size:12px; line-height:1.6; white-space:pre; overflow-x:auto; color:var(--text-dim); }

/* ══════════ 問題 ══════════ */
.qprog{ display:flex; align-items:center; gap:14px; margin-bottom:20px; max-width:760px; }
.qtrack{ flex:1; height:4px; background:var(--surface2); border-radius:2px; overflow:hidden; }
.qfill{ height:100%; background:var(--accent); transition:width .3s; }
.qlbl{ font-size:11px; color:var(--text-muted); white-space:nowrap; font-family:'DM Sans',sans-serif; }
.qcard{ background:var(--surface); border:1px solid var(--border); border-radius:var(--r); padding:22px 24px; margin-bottom:14px; max-width:760px; }
@media (max-width:640px){ .qcard{ padding:18px 16px; } }
.qmeta{ display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin-bottom:12px; }
.qmeta .src{ font-size:11px; color:var(--text-muted); font-family:'DM Sans','Noto Sans JP',sans-serif; }
.qq{ font-size:15px; font-weight:500; color:var(--text); line-height:1.85; margin-bottom:16px; }
.stmts{ background:var(--surface2); border-radius:var(--r); padding:12px 16px; margin-bottom:16px; }
.stmt{ display:flex; gap:10px; font-size:14px; line-height:1.8; margin:6px 0; }
.stmt .sl{ font-weight:700; color:var(--accent); flex-shrink:0; }
.stmt .sj{ flex-shrink:0; font-weight:700; width:22px; text-align:center; }
.stmt .sj.o{ color:var(--green); } .stmt .sj.x{ color:var(--red); }
.choices{ display:flex; flex-direction:column; gap:9px; }
.choice{ text-align:left; padding:12px 15px; border:1px solid var(--border); border-radius:var(--r); background:var(--surface); color:var(--text); font-size:14px; cursor:pointer; transition:all .12s; display:flex; align-items:flex-start; gap:11px; -webkit-tap-highlight-color:transparent; line-height:1.75; }
.choice:hover:not(:disabled){ border-color:var(--accent-soft); background:var(--accent-bg); }
.choice:disabled{ cursor:default; }
.choice .ck{ width:24px; height:24px; border-radius:50%; border:1px solid var(--border); display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; color:var(--text-muted); flex-shrink:0; font-family:'DM Sans',sans-serif; margin-top:1px; }
.choice.ok{ border-color:var(--green); background:var(--green-bg); } .choice.ok .ck{ background:var(--green); border-color:var(--green); color:#fff; }
.choice.ng{ border-color:var(--red); background:var(--red-bg); } .choice.ng .ck{ background:var(--red); border-color:var(--red); color:#fff; }
.choice.sel{ border-color:var(--accent); background:var(--accent-bg); } .choice.sel .ck{ background:var(--accent); border-color:var(--accent); color:#fff; }
.cwhy{ display:none; font-size:12.5px; color:var(--text-dim); margin:-3px 0 4px 36px; line-height:1.8; padding:2px 0 4px 12px; border-left:2px solid var(--border); }
.cwhy.show{ display:block; }
.cwhy b.o{ color:var(--green); } .cwhy b.x{ color:var(--red); }
.fb{ border-radius:var(--r); padding:14px 18px; margin-top:14px; font-size:13.5px; line-height:1.85; max-width:760px; animation:fadein .2s ease; }
.fb.ok{ background:var(--green-bg); border:1px solid rgba(47,158,99,.3); }
.fb.ng{ background:var(--red-bg); border:1px solid rgba(207,77,71,.3); }
.fb .fb-h{ font-weight:700; margin-bottom:5px; }
.fb.ok .fb-h{ color:var(--green); } .fb.ng .fb-h{ color:var(--red); }
.fb .fb-body{ color:var(--text-dim); }
@keyframes fadein{ from{opacity:0;transform:translateY(-4px)} to{opacity:1;transform:none} }
.qnav{ display:flex; gap:10px; margin-top:16px; max-width:760px; align-items:center; flex-wrap:wrap; }
.qnav .spacer{ flex:1; }
.keepbtn{ border:1px solid var(--border); background:var(--surface); border-radius:var(--r); padding:7px 12px; font-size:12px; cursor:pointer; color:var(--text-dim); }
.keepbtn.on{ border-color:var(--amber); color:#8a6510; background:var(--amber-bg); }

/* ○× */
.ox-card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--r); padding:22px 24px; max-width:760px; }
.ox-t{ font-size:15.5px; line-height:1.9; font-weight:500; margin-bottom:18px; }
.ox-btns{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.ox-b{ padding:16px; font-size:24px; font-weight:700; border:1px solid var(--border); border-radius:10px; background:var(--surface); cursor:pointer; -webkit-tap-highlight-color:transparent; transition:all .12s; }
.ox-b.o{ color:var(--green); } .ox-b.x{ color:var(--red); }
.ox-b:hover:not(:disabled){ background:var(--surface2); }
.ox-b.hit{ outline:3px solid currentColor; }

/* ══════════ 本試験モード ══════════ */
.exbar{ position:sticky; top:-34px; z-index:3; background:var(--bg); display:flex; align-items:center; gap:10px; padding:8px 0 12px; margin-top:-8px; flex-wrap:wrap; max-width:760px; }
@media (max-width:640px){ .exbar{ top:-20px; } }
.timer{ font-family:'DM Sans',ui-monospace,monospace; font-size:16px; font-weight:500; padding:5px 12px; border-radius:6px; background:var(--surface); color:var(--text); border:1px solid var(--border); letter-spacing:.05em; }
.timer.warn{ background:var(--red-bg); color:var(--red); border-color:var(--red); }
.grid50{ display:grid; grid-template-columns:repeat(10,1fr); gap:5px; max-width:760px; margin:6px 0 16px; }
.gcell{ aspect-ratio:1.4; border:1px solid var(--border); border-radius:5px; background:var(--surface); font-size:11px; font-family:'DM Sans',sans-serif; color:var(--text-muted); cursor:pointer; display:flex; align-items:center; justify-content:center; position:relative; padding:0; }
.gcell.ans{ background:var(--accent-bg); color:var(--accent); border-color:var(--accent-soft); font-weight:600; }
.gcell.cur{ outline:2px solid var(--accent); }
.gcell.flag::after{ content:""; position:absolute; top:2px; right:2px; width:6px; height:6px; border-radius:50%; background:var(--amber); }
.gcell.ok{ background:var(--green-bg); color:var(--green); border-color:rgba(47,158,99,.5); }
.gcell.ng{ background:var(--red-bg); color:var(--red); border-color:rgba(207,77,71,.5); }
.gcell.na{ background:var(--surface2); color:var(--text-muted); border-style:dashed; }
.result-badge{ text-align:center; padding:24px 20px; border-radius:var(--r); margin-bottom:18px; max-width:760px; }
.result-badge.pass{ background:var(--green-bg); border:1px solid rgba(47,158,99,.4); }
.result-badge.fail{ background:var(--red-bg); border:1px solid rgba(207,77,71,.4); }
.rb-big{ font-size:34px; font-weight:700; font-family:'DM Sans','Noto Sans JP',sans-serif; }
.pass .rb-big{ color:var(--green); } .fail .rb-big{ color:var(--red); }
.rb-sub{ font-size:13px; color:var(--text-dim); margin-top:6px; }

/* ══════════ 一覧 ══════════ */
.list-item{ display:flex; gap:12px; align-items:center; width:100%; text-align:left; background:var(--surface); border:1px solid var(--border); border-radius:var(--r); padding:12px 16px; margin-bottom:9px; }
.list-item .li-main{ flex:1; min-width:0; }
.list-item .li-t{ font-weight:600; font-size:14px; }
.list-item .li-s{ font-size:12px; color:var(--text-muted); margin-top:2px; }
.rev-item{ background:var(--surface); border:1px solid var(--border); border-left:3px solid var(--border); border-radius:var(--r); padding:12px 15px; margin-bottom:9px; font-size:13px; max-width:760px; cursor:pointer; }
.rev-item.ok{ border-left-color:var(--green); } .rev-item.no{ border-left-color:var(--red); }
.rev-item .rq{ color:var(--text); margin:4px 0 2px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.rev-item .rl{ color:var(--text-dim); font-size:12px; }
.rev-item .rl .yes{ color:var(--green); font-weight:600; } .rev-item .rl .bad{ color:var(--red); font-weight:600; }
table.hist{ width:100%; border-collapse:collapse; font-size:12.5px; background:var(--surface); border:1px solid var(--border); max-width:760px; }
table.hist th{ text-align:left; padding:8px 10px; background:var(--surface2); color:var(--text-dim); font-size:11px; }
table.hist td{ padding:8px 10px; border-top:1px solid var(--border-soft); }

{ id:'ishi', field:'kenri', icon:'💬', title:'意思表示', sub:'心裡留保・虚偽表示・錯誤・詐欺・強迫', gram:`
<h3>まず、この単元は何？</h3>
<p>「本心と違う意思表示」や「だまされた・脅された意思表示」が<strong>有効か・無効か・取り消せるか</strong>、そして<strong>第三者に主張できるか</strong>を整理する単元です。毎年のように出ます。</p>
<h3>5つの比較表（これだけ覚える）</h3>
<div class="tblwrap"><table><thead><tr><th>種類</th><th>当事者間の効果</th><th>第三者に対抗できない相手</th></tr></thead><tbody>
<tr><td>心裡留保（冗談）</td><td>原則<strong>有効</strong>。相手が悪意・有過失なら無効</td><td>善意の第三者</td></tr>
<tr><td>虚偽表示（通謀）</td><td><strong>無効</strong></td><td>善意の第三者（過失は問わない）</td></tr>
<tr><td>錯誤（勘違い）</td><td><strong>取り消せる</strong>（重要な錯誤）</td><td>善意・無過失の第三者</td></tr>
<tr><td>詐欺（だまされた）</td><td><strong>取り消せる</strong></td><td>善意・無過失の第三者</td></tr>
<tr><td>強迫（脅された）</td><td><strong>取り消せる</strong></td><td>なし（<strong>誰にでも対抗できる</strong>）</td></tr>
</tbody></table></div>
<div class="hbox"><span class="term">覚え方</span>「強迫された人は一番かわいそう」→ 第三者が善意でも取り戻せる。<br>「虚偽表示は自分もウソに加担した」→ 善意の第三者には過失があっても負ける。</div>
<h3>錯誤のポイント</h3>
<ul><li>取り消せるのは、法律行為の目的と取引上の社会通念に照らして<strong>重要な</strong>錯誤</li>
<li>動機の錯誤（基礎事情の錯誤）は、その事情が<strong>法律行為の基礎とされていることが表示</strong>されていたときに限り取り消せる</li>
<li>表意者に<strong>重大な過失</strong>があると原則取り消せない（相手方が悪意・重過失のとき、相手方も同じ錯誤のときは取り消せる）</li></ul>
<h3>第三者による詐欺・強迫</h3>
<p>契約の相手方ではなく<strong>第三者</strong>がだました場合、相手方が<strong>悪意または有過失</strong>のときに限り取り消せます。第三者が<strong>強迫</strong>した場合は、相手方が善意無過失でも取り消せます。</p>
<div class="wbox">⚠️ 2020年施行の改正民法で、錯誤は「無効」→「取消し」に変わりました。古い問題集の解説には注意。</div>
`},

{ id:'seigen', field:'kenri', icon:'🧒', title:'制限行為能力者', sub:'未成年者・成年被後見人・被保佐人・被補助人', gram:`
<h3>4つの類型</h3>
<div class="tblwrap"><table><thead><tr><th>類型</th><th>保護者</th><th>単独でした行為</th></tr></thead><tbody>
<tr><td>未成年者（18歳未満）</td><td>親権者・未成年後見人</td><td>同意のない行為は取り消せる。ただし<strong>単に権利を得・義務を免れる行為</strong>、処分を許された財産、営業を許された営業は単独で可</td></tr>
<tr><td>成年被後見人</td><td>成年後見人</td><td><strong>日用品の購入その他日常生活に関する行為以外</strong>は取り消せる。後見人の<strong>同意を得てした行為でも取り消せる</strong></td></tr>
<tr><td>被保佐人</td><td>保佐人</td><td>不動産の売買・借財・保証など<strong>重要な行為</strong>は保佐人の同意が必要（ないと取り消せる）</td></tr>
<tr><td>被補助人</td><td>補助人</td><td>家庭裁判所が定めた<strong>特定の行為</strong>だけ同意が必要</td></tr>
</tbody></table></div>
<h3>よく出るポイント</h3>
<ul><li>成年後見人が本人の<strong>居住用</strong>の建物・敷地を売却・賃貸・抵当権設定するには<strong>家庭裁判所の許可</strong>が必要</li>
<li>制限行為能力者が<strong>詐術</strong>を用いて行為能力者と信じさせたときは、取り消せない</li>
<li>取消しは、<strong>善意の第三者にも対抗できる</strong>（制限行為能力者の保護が優先）</li>
<li>相手方は1か月以上の期間を定めて追認するかどうか<strong>催告</strong>できる</li></ul>
<div class="hbox"><span class="term">ひっかけ</span>「成年被後見人が成年後見人の同意を得て土地を売却した → 取り消せない」は<strong>×</strong>。成年被後見人は同意どおりに行動できるとは限らないため、同意があっても取り消せます。</div>
`},

{ id:'dairi', field:'kenri', icon:'🤝', title:'代理', sub:'顕名・無権代理・表見代理・自己契約', gram:`
<h3>代理の基本</h3>
<p>代理人が<strong>本人のためにすることを示して</strong>（顕名）意思表示をすると、効果は直接本人に帰属します。顕名がないと原則として代理人自身の契約になります（相手方が本人のためと知り、または知ることができたときは本人に帰属）。</p>
<ul><li>代理人は<strong>行為能力者である必要はない</strong>。制限行為能力者が代理人としてした行為は、行為能力の制限を理由に取り消せない</li>
<li>代理人が本人の許諾なく<strong>自己契約・双方代理</strong>をすると、<strong>無権代理とみなされる</strong>（債務の履行や本人があらかじめ許諾した行為を除く）</li>
<li>任意代理人が<strong>復代理人</strong>を選べるのは、本人の許諾があるときか、やむを得ない事由があるとき</li></ul>
<h3>無権代理 ── 相手方が使える4つの手段</h3>
<div class="tblwrap"><table><thead><tr><th>手段</th><th>使える相手方</th></tr></thead><tbody>
<tr><td>催告権</td><td>悪意でも可。本人が期間内に確答しなければ<strong>追認拒絶</strong>とみなす</td></tr>
<tr><td>取消権</td><td><strong>善意</strong>の相手方（本人が追認する前まで）</td></tr>
<tr><td>無権代理人の責任追及</td><td>原則<strong>善意・無過失</strong>（無権代理人が自分に代理権がないと知っていたときは善意・有過失でも可）</td></tr>
<tr><td>表見代理</td><td>善意・無過失（代理権があると信じる正当な理由）</td></tr>
</tbody></table></div>
<div class="hbox"><span class="term">追認</span>本人が追認すると、別段の意思表示がない限り<strong>契約の時にさかのぼって</strong>有効になります。</div>
<h3>無権代理と相続</h3>
<ul><li>無権代理人が本人を<strong>単独相続</strong> → 追認拒絶できず、契約は当然に有効</li>
<li>本人が無権代理人を相続 → 本人は追認を<strong>拒絶できる</strong>（ただし無権代理人の責任は承継する）</li></ul>
`},

{ id:'jiko', field:'kenri', icon:'⏳', title:'時効', sub:'取得時効・消滅時効・完成猶予と更新', gram:`
<h3>取得時効</h3>
<div class="tblwrap"><table><thead><tr><th>占有開始時</th><th>期間</th></tr></thead><tbody>
<tr><td>善意・無過失</td><td><strong>10年</strong></td></tr>
<tr><td>上記以外（悪意・有過失）</td><td><strong>20年</strong></td></tr>
</tbody></table></div>
<ul><li>要件：<strong>所有の意思</strong>をもって、平穏・公然に占有。賃借人の占有では所有権は時効取得できない</li>
<li>善意・無過失は<strong>占有開始時</strong>にあればよい（途中で悪意になっても10年）</li>
<li>前の占有者の占有期間を<strong>あわせて主張</strong>できる（その場合は前の占有者の悪意・過失も引き継ぐ）</li></ul>
<h3>消滅時効（債権）</h3>
<div class="formula">知った時から <b>5年</b> ／ 行使できる時から <b>10年</b>（早いほう）</div>
<ul><li>人の生命・身体の侵害による損害賠償請求権は、行使できる時から<strong>20年</strong></li>
<li><strong>所有権</strong>は消滅時効にかからない</li></ul>
<h3>援用・放棄・完成猶予・更新</h3>
<ul><li>時効の効果は<strong>援用</strong>しないと生じない。効果は起算日にさかのぼる</li>
<li>時効の利益は<strong>あらかじめ（完成前に）放棄できない</strong>。完成後の放棄は可</li>
<li>債務者が<strong>承認</strong>すると時効は<strong>更新</strong>（ゼロから再スタート）</li>
<li>裁判上の請求は、手続中は<strong>完成猶予</strong>、確定判決で権利が確定すると<strong>更新</strong></li>
<li>催告（内容証明など）は<strong>6か月</strong>の完成猶予のみ</li></ul>
`},

{ id:'bukken', field:'kenri', icon:'📜', title:'物権変動と登記', sub:'対抗要件・二重譲渡・取消しと登記', gram:`
<h3>原則：不動産は「登記」で勝負</h3>
<p>不動産の物権変動は、<strong>登記をしなければ第三者に対抗できません</strong>（民法177条）。二重譲渡では、先に契約したかではなく<strong>先に登記した方</strong>が勝ちます。</p>
<h3>登記なしで対抗できる「第三者でない人」</h3>
<ul><li><strong>背信的悪意者</strong>（単なる悪意者には登記が必要）</li>
<li><strong>不法占拠者</strong>・無権利者</li>
<li>前主・後主の関係にある者（売主本人など）</li></ul>
<h3>「前」か「後」かで変わる3パターン</h3>
<div class="tblwrap"><table><thead><tr><th>場面</th><th>〜の前に現れた第三者</th><th>〜の後に現れた第三者</th></tr></thead><tbody>
<tr><td>取消し</td><td>詐欺：善意無過失なら第三者の勝ち／強迫：取消した人の勝ち</td><td><strong>登記の先後</strong>で決める</td></tr>
<tr><td>解除</td><td>第三者が<strong>登記</strong>を備えていれば第三者の勝ち</td><td><strong>登記の先後</strong></td></tr>
<tr><td>取得時効の完成</td><td>時効取得者は登記なしで対抗できる</td><td><strong>登記の先後</strong></td></tr>
</tbody></table></div>
<div class="hbox"><span class="term">コツ</span>「後」に出てきた第三者は、どれも<strong>二重譲渡と同じ</strong>＝登記の早い者勝ち、と覚えると一気に片づきます。</div>
<h3>相続と登記</h3>
<p>相続による権利の承継は、<strong>法定相続分を超える部分</strong>については登記がなければ第三者に対抗できません。</p>
`},

{ id:'teitou', field:'kenri', icon:'🏦', title:'抵当権', sub:'物上代位・法定地上権・賃借人の保護', gram:`
<h3>抵当権の性質</h3>
<ul><li><strong>付従性</strong>（債権がなければ成立しない・消えれば消える）、<strong>随伴性</strong>、<strong>不可分性</strong>、<strong>物上代位性</strong></li>
<li>抵当権を設定しても、設定者は目的物を<strong>使用・収益</strong>できる（占有は移らない）</li>
<li>利息などは、後順位抵当権者などがいる場合、<strong>満期となった最後の2年分</strong>に限り優先弁済</li></ul>
<h3>物上代位</h3>
<p>目的物の売却代金・賃料・火災保険金などに対しても抵当権を行使できます。ただし<strong>払渡し・引渡しの前に差押え</strong>が必要です。</p>
<h3>法定地上権の成立要件</h3>
<ol><li>抵当権設定当時、土地の上に<strong>建物が存在</strong></li>
<li>設定当時、土地と建物の所有者が<strong>同一</strong></li>
<li>土地・建物の一方または両方に抵当権が設定</li>
<li>競売の結果、土地と建物の所有者が<strong>別々</strong>になった</li></ol>
<div class="hbox"><span class="term">一括競売</span>更地に抵当権設定後に建物が建てられた場合、抵当権者は土地と建物を<strong>一括して競売できる</strong>（優先弁済は土地の代価からのみ）。</div>
<h3>抵当権に後れる賃借人</h3>
<p>抵当権設定登記の後の賃借人は、抵当権者・買受人に対抗できません。ただし<strong>建物</strong>の賃借人で競売手続開始前から使用している者は、買受人の買受けの時から<strong>6か月</strong>は明渡しを猶予されます。</p>
<h3>根抵当権</h3>
<ul><li><strong>極度額</strong>の範囲で、一定範囲の不特定の債権を担保</li>
<li>元本確定前は<strong>随伴性がない</strong>（被担保債権を譲渡しても根抵当権は移らない）</li>
<li>極度額の変更には<strong>利害関係者の承諾</strong>が必要</li></ul>
`},

{ id:'shakuya', field:'kenri', icon:'🏠', title:'借地借家法（借家）', sub:'更新・解約申入れ・定期建物賃貸借', gram:`
<h3>期間と更新</h3>
<div class="tblwrap"><table><thead><tr><th>場面</th><th>ルール</th></tr></thead><tbody>
<tr><td>期間1年未満の定め</td><td><strong>期間の定めのない</strong>賃貸借とみなす（定期建物賃貸借を除く）</td></tr>
<tr><td>期間の定めあり</td><td>期間満了の<strong>1年前から6か月前</strong>までに更新しない旨の通知がなければ、従前と同一の条件で更新（期間は定めのないものとなる）</td></tr>
<tr><td>賃貸人からの更新拒絶・解約申入れ</td><td><strong>正当事由</strong>が必要</td></tr>
<tr><td>期間の定めなし・賃貸人から解約申入れ</td><td>申入れから<strong>6か月</strong>で終了</td></tr>
<tr><td>期間の定めなし・賃借人から解約申入れ</td><td>民法どおり<strong>3か月</strong>で終了</td></tr>
</tbody></table></div>
<h3>対抗要件・その他</h3>
<ul><li>建物の<strong>引渡し</strong>があれば、その後の建物取得者に対抗できる（登記不要）</li>
<li><strong>造作買取請求権</strong>は特約で排除できる</li>
<li>借賃を<strong>一定期間増額しない</strong>特約は有効。<strong>減額しない</strong>特約は、普通の建物賃貸借では無効</li></ul>
<h3>定期建物賃貸借（更新なし）</h3>
<ul><li><strong>書面（電磁的記録を含む）</strong>で契約する。公正証書でなくてよい</li>
<li>契約前に「更新がなく期間満了で終了する」旨を<strong>書面を交付して説明</strong>（承諾を得て電磁的方法も可）。説明がないと更新がない旨の定めは<strong>無効</strong></li>
<li><strong>1年未満</strong>の期間も有効</li>
<li>期間1年以上なら、満了の1年前〜6か月前に終了の通知が必要</li>
<li>床面積<strong>200㎡未満の居住用</strong>は、転勤・療養などやむを得ない事情で賃借人から中途解約できる</li>
<li>借賃を減額しない特約も<strong>有効</strong></li></ul>
`},

{ id:'souzoku', field:'kenri', icon:'🌳', title:'相続', sub:'法定相続分・遺留分・放棄・遺言', gram:`
<h3>法定相続分</h3>
<div class="tblwrap"><table><thead><tr><th>相続人</th><th>配偶者</th><th>血族</th></tr></thead><tbody>
<tr><td>配偶者＋子</td><td>1/2</td><td>子 1/2（人数で等分）</td></tr>
<tr><td>配偶者＋直系尊属</td><td>2/3</td><td>直系尊属 1/3</td></tr>
<tr><td>配偶者＋兄弟姉妹</td><td>3/4</td><td>兄弟姉妹 1/4</td></tr>
</tbody></table></div>
<ul><li>代襲相続の原因は<strong>死亡・欠格・廃除</strong>。<strong>相続放棄は代襲原因にならない</strong></li>
<li>兄弟姉妹の代襲は<strong>おい・めいまで</strong></li></ul>
<h3>承認と放棄</h3>
<ul><li>自己のために相続の開始があったことを<strong>知った時から3か月以内</strong>に、家庭裁判所に申述</li>
<li><strong>限定承認</strong>は共同相続人<strong>全員で</strong>しなければならない。放棄は単独でできる</li>
<li>相続開始<strong>前</strong>の放棄はできない（遺留分の放棄は家庭裁判所の許可があれば可）</li></ul>
<h3>遺留分</h3>
<div class="formula">直系尊属のみ <b>1/3</b> ／ それ以外 <b>1/2</b> ／ 兄弟姉妹 <b>なし</b></div>
<p>遺留分を侵害されたときは、受遺者などに対して<strong>金銭</strong>（遺留分侵害額）を請求します。</p>
<h3>遺言</h3>
<ul><li><strong>15歳</strong>に達すれば遺言できる</li>
<li>自筆証書遺言の<strong>財産目録</strong>は自書でなくてよい（各ページに署名押印）</li>
<li>法務局で保管された自筆証書遺言は<strong>検認不要</strong></li>
<li>前の遺言と抵触する後の遺言 → 抵触部分は<strong>後の遺言で撤回</strong>したものとみなす</li></ul>
`},

/* ───────────── 宅建業法 ───────────── */
{ id:'menkyo', field:'gyoho', icon:'🪪', title:'宅建業の定義と免許', sub:'取引・宅地・免許権者・欠格事由', gram:`
<h3>「宅建業」にあたるか</h3>
<div class="tblwrap"><table><thead><tr><th></th><th>売買</th><th>交換</th><th>貸借</th></tr></thead><tbody>
<tr><td>自ら当事者</td><td>○</td><td>○</td><td><strong>×（不要）</strong></td></tr>
<tr><td>代理</td><td>○</td><td>○</td><td>○</td></tr>
<tr><td>媒介</td><td>○</td><td>○</td><td>○</td></tr>
</tbody></table></div>
<div class="hbox"><span class="term">最重要</span>自分のマンションを<strong>自ら貸す</strong>（転貸を含む）のは宅建業ではない → 免許不要。</div>
<p><strong>宅地</strong>＝建物の敷地に供する目的で取引される土地、または<strong>用途地域内</strong>の土地（道路・公園・河川・広場・水路を除く）。</p>
<h3>免許権者と有効期間</h3>
<ul><li>事務所が<strong>2つ以上の都道府県</strong> → 国土交通大臣／<strong>1つの都道府県</strong>だけ → 都道府県知事</li>
<li>有効期間<strong>5年</strong>。更新は満了の<strong>90日前から30日前</strong>までに申請</li>
<li>期間内に申請したのに処分がない → 処分があるまで旧免許は<strong>有効</strong></li></ul>
<h3>欠格事由（主なもの）</h3>
<ul><li>破産手続開始の決定を受けて<strong>復権を得ない</strong>者（復権すれば直ちに免許を受けられる）</li>
<li><strong>拘禁刑以上</strong>の刑に処せられ、執行を終わってから<strong>5年</strong>を経過しない者</li>
<li>宅建業法・暴力団対策法違反、傷害・暴行・脅迫・背任などで<strong>罰金刑</strong>に処せられ5年を経過しない者</li>
<li>暴力団員または暴力団員でなくなってから5年を経過しない者</li>
<li>不正手段による免許取得などで<strong>免許を取り消され</strong>、5年を経過しない者</li></ul>
<div class="wbox">⚠️ 2025年6月の刑法改正で「懲役・禁錮」は「拘禁刑」に一本化されました。古い問題集の「禁錮以上の刑」は「拘禁刑以上の刑」と読み替えます。<strong>執行猶予</strong>は、期間が満了すれば翌日から免許を受けられます。</div>
`},

{ id:'shi', field:'gyoho', icon:'👤', title:'宅建士', sub:'登録・宅建士証・専任の設置義務', gram:`
<h3>専任の宅建士の設置</h3>
<ul><li><strong>事務所</strong>：業務に従事する者<strong>5人に1人以上</strong></li>
<li>契約の締結や申込みを受ける<strong>案内所など</strong>：<strong>1人以上</strong></li>
<li>不足したら<strong>2週間以内</strong>に補充などの措置</li></ul>
<h3>登録</h3>
<ul><li>試験合格＋<strong>2年以上の実務経験</strong>（または国土交通大臣の登録実務講習修了）</li>
<li>登録先は<strong>受験した都道府県の知事</strong>。登録に有効期間はない</li>
<li>氏名・住所・本籍・勤務先の宅建業者の商号などが変わったら<strong>遅滞なく変更の登録</strong></li>
<li>登録の移転は<strong>任意</strong>（勤務先が他県に変わったときに申請できる）。住所変更だけでは移転できない</li></ul>
<h3>宅建士証</h3>
<ul><li>有効期間<strong>5年</strong></li>
<li>交付申請前<strong>6か月以内</strong>に行われる知事指定の<strong>法定講習</strong>を受講（試験合格後<strong>1年以内</strong>なら免除）</li>
<li><strong>重要事項の説明</strong>のときは、請求がなくても<strong>提示</strong>しなければならない</li>
<li>取引の関係者から請求があったときも提示</li>
<li>氏名・住所を変更したら、変更の登録とあわせて<strong>書換え交付</strong>を申請</li></ul>
<h3>宅建士だけができる3つの事務</h3>
<div class="formula">① 重要事項の<b>説明</b>　② 重要事項説明書への<b>記名</b>　③ 37条書面への<b>記名</b></div>
<p>専任である必要はありません（専任でない宅建士でもできる）。</p>
`},

{ id:'hosho', field:'gyoho', icon:'💴', title:'営業保証金と保証協会', sub:'供託額・期限・還付', gram:`
<h3>2つの制度の比較</h3>
<div class="tblwrap"><table><thead><tr><th></th><th>営業保証金</th><th>保証協会（弁済業務保証金）</th></tr></thead><tbody>
<tr><td>金額</td><td>主たる事務所 <strong>1,000万円</strong><br>その他の事務所 <strong>500万円</strong>ずつ</td><td>分担金：主たる事務所 <strong>60万円</strong><br>その他の事務所 <strong>30万円</strong>ずつ</td></tr>
<tr><td>納める先</td><td>主たる事務所の<strong>最寄りの供託所</strong></td><td><strong>保証協会</strong>に納付（協会が1週間以内に供託）</td></tr>
<tr><td>支払方法</td><td>金銭または有価証券</td><td><strong>金銭のみ</strong></td></tr>
<tr><td>事務所を増設</td><td>供託して届け出てから業務開始</td><td>設置日から<strong>2週間以内</strong>に納付</td></tr>
<tr><td>還付の上限</td><td>供託額</td><td>営業保証金に相当する額</td></tr>
</tbody></table></div>
<h3>有価証券の評価</h3>
<div class="formula">国債 <b>100%</b> ／ 地方債・政府保証債 <b>90%</b> ／ その他 <b>80%</b></div>
<h3>還付を受けられる人</h3>
<p>宅建業者と<strong>宅建業に関する取引</strong>をして債権を持つ者。ただし<strong>宅建業者は除く</strong>。広告代金・内装工事代金などは対象外です。</p>
<h3>期限まわり</h3>
<ul><li>免許を受けてから<strong>3か月以内</strong>に供託の届出がない → 知事等は催告。催告から<strong>1か月以内</strong>に届出がなければ免許を取り消すことが<strong>できる</strong></li>
<li>還付で不足した → 通知を受けた日から<strong>2週間以内</strong>に補充</li>
<li>取戻し：原則<strong>6か月以上</strong>の期間を定めて公告が必要（保証協会への加入や、二重供託の場合などは公告不要）</li></ul>
`},

{ id:'juusetsu', field:'gyoho', icon:'📑', title:'重要事項説明（35条）と37条書面', sub:'誰に・いつ・誰が・何を', gram:`
<h3>2つの書面の比較</h3>
<div class="tblwrap"><table><thead><tr><th></th><th>35条書面（重要事項説明）</th><th>37条書面（契約書面）</th></tr></thead><tbody>
<tr><td>時期</td><td>契約が<strong>成立するまで</strong></td><td>契約成立後<strong>遅滞なく</strong></td></tr>
<tr><td>相手</td><td>買主・借主など<strong>取得する側</strong></td><td>契約の<strong>両当事者</strong></td></tr>
<tr><td>宅建士の説明</td><td><strong>必要</strong>（宅建士証を提示）</td><td>不要</td></tr>
<tr><td>宅建士の記名</td><td>必要</td><td>必要</td></tr>
<tr><td>相手方が宅建業者</td><td>書面の交付は必要・<strong>説明は不要</strong></td><td>交付は必要</td></tr>
</tbody></table></div>
<ul><li>相手方の承諾があれば、書面の交付に代えて<strong>電磁的方法</strong>で提供できる</li>
<li>テレビ会議などによる説明（<strong>IT重説</strong>）も、一定の条件で可能</li>
<li>説明の<strong>場所に制限はない</strong>（喫茶店でも可）</li></ul>
<h3>35条の主な記載事項</h3>
<ul><li>登記された権利の種類・内容、法令上の制限、私道負担（貸借の場合は建物なら不要）</li>
<li>飲用水・電気・ガスの供給、排水施設の整備状況</li>
<li>代金・借賃<strong>以外</strong>に授受される金銭の額と目的</li>
<li>契約の解除、損害賠償額の予定・違約金</li>
<li>手付金等の保全措置の概要、支払金・預り金の保全措置の有無</li>
<li>造成宅地防災区域・土砂災害警戒区域・津波災害警戒区域、<strong>水害ハザードマップ</strong>上の所在地</li>
<li>建物状況調査（インスペクション）の有無と結果の概要（既存建物）</li></ul>
<div class="hbox"><span class="term">見分け方</span>「代金の額・支払時期」「引渡し時期」「移転登記の申請時期」は<strong>37条だけ</strong>。契約で決まることだからです。</div>
`},

{ id:'hasshu', field:'gyoho', icon:'🛡️', title:'8種制限', sub:'業者が売主・素人が買主の取引', gram:`
<h3>適用される場面</h3>
<p><strong>売主が宅建業者</strong>で、<strong>買主が宅建業者でない</strong>場合だけ。業者間取引や、媒介・代理には適用されません。</p>
<h3>クーリング・オフ</h3>
<ul><li><strong>事務所等以外</strong>の場所で買受けの申込み・契約をした場合に使える</li>
<li>買主が<strong>自ら申し出た</strong>自宅・勤務先で申込み → 使えない。喫茶店・ホテルのロビー・テント張りの案内所 → 使える</li>
<li>使えなくなる：クーリング・オフできる旨と方法を<strong>書面で告げられた日から8日</strong>経過／<strong>引渡しを受け、かつ代金全部を支払った</strong></li>
<li><strong>書面</strong>で行い、<strong>発した時</strong>に効力が生じる。業者は受領した手付金等を速やかに返還し、損害賠償・違約金を請求できない</li>
<li>買主に不利な特約は無効</li></ul>
<h3>数字で出る制限</h3>
<div class="tblwrap"><table><thead><tr><th>制限</th><th>内容</th></tr></thead><tbody>
<tr><td>損害賠償額の予定・違約金</td><td>合計で代金の<strong>2/10</strong>まで。超える部分は無効</td></tr>
<tr><td>手付の額</td><td>代金の<strong>2/10</strong>まで。性質は<strong>解約手付</strong>とされる</td></tr>
<tr><td>手付金等の保全措置</td><td>未完成物件：代金の<strong>5%</strong>超 または <strong>1,000万円</strong>超<br>完成物件：代金の<strong>10%</strong>超 または <strong>1,000万円</strong>超</td></tr>
<tr><td>担保責任の特約</td><td>通知期間を<strong>引渡しから2年以上</strong>とする特約は有効。それ以外で民法より不利な特約は無効</td></tr>
<tr><td>割賦販売の解除</td><td><strong>30日以上</strong>の期間を定めて<strong>書面で催告</strong></td></tr>
<tr><td>所有権留保</td><td>代金の<strong>3/10</strong>を超える支払いを受けたら原則不可</td></tr>
</tbody></table></div>
<div class="hbox"><span class="term">解約手付</span>買主は手付を<strong>放棄</strong>、売主は手付の<strong>倍額を現実に提供</strong>して解除できる（相手方が履行に着手するまで）。</div>
`},

{ id:'houshu', field:'gyoho', icon:'🧮', title:'報酬の制限', sub:'売買・貸借・低廉な空家等', gram:`
<h3>売買の媒介（1つの依頼者から受け取れる上限・税抜）</h3>
<div class="tblwrap"><table><thead><tr><th>代金（税抜）</th><th>料率</th></tr></thead><tbody>
<tr><td>200万円以下の部分</td><td>5%</td></tr>
<tr><td>200万円超〜400万円以下の部分</td><td>4%</td></tr>
<tr><td>400万円を超える部分</td><td>3%</td></tr>
</tbody></table></div>
<div class="formula">400万円超の速算式：代金 × <b>3%</b> ＋ <b>6万円</b><span class="fnote">課税事業者は ×1.1（免税事業者は ×1.04）</span></div>
<ul><li><strong>代理</strong>：媒介の<strong>2倍</strong>まで。相手方からも受け取るときは、合計で媒介の2倍まで</li>
<li>建物の代金は<strong>税抜</strong>にしてから計算（土地は非課税）</li>
<li>依頼者の依頼による<strong>広告料金</strong>、特別な依頼による費用は別に受領できる</li></ul>
<h3>貸借</h3>
<ul><li>貸主・借主<strong>双方から合計</strong>で借賃の<strong>1か月分</strong>（＋消費税）まで</li>
<li><strong>居住用建物</strong>の媒介は、依頼者の<strong>一方から0.5か月分</strong>まで（依頼の承諾を得ていれば、合計1か月分の範囲で配分可）</li>
<li>居住用建物<strong>以外</strong>で<strong>権利金</strong>の授受がある場合は、権利金を売買代金とみなして計算できる</li></ul>
<h3>低廉な空家等の特例（2024年7月改正）</h3>
<p>代金<strong>800万円以下</strong>の宅地・建物の売買の媒介・代理では、現地調査等の費用を含めて<strong>30万円（税抜）</strong>まで受領できます。媒介契約の締結時に、あらかじめ依頼者に説明して<strong>合意</strong>しておくことが必要です。</p>
<div class="wbox">⚠️ 改正前は「400万円以下・売主から18万円まで」でした。古い問題集は要注意。</div>
`},

/* ───────────── 法令上の制限 ───────────── */
{ id:'kaihatsu', field:'horei', icon:'🗺️', title:'都市計画法（開発許可）', sub:'許可が要らない規模と例外', gram:`
<h3>開発行為とは</h3>
<p>主として<strong>建築物の建築</strong>または<strong>特定工作物の建設</strong>のために行う、土地の<strong>区画形質の変更</strong>。開発行為をするには原則として<strong>知事等の許可</strong>が必要です。</p>
<h3>規模による例外（これ未満なら許可不要）</h3>
<div class="tblwrap"><table><thead><tr><th>区域</th><th>許可不要の規模</th></tr></thead><tbody>
<tr><td>市街化区域</td><td><strong>1,000㎡未満</strong>（三大都市圏の一部は500㎡未満）</td></tr>
<tr><td>市街化調整区域</td><td><strong>規模にかかわらず許可必要</strong></td></tr>
<tr><td>非線引き区域・準都市計画区域</td><td><strong>3,000㎡未満</strong></td></tr>
<tr><td>上記以外（区域外）</td><td><strong>1ha未満</strong></td></tr>
</tbody></table></div>
<h3>規模に関係なく許可不要のもの</h3>
<ul><li><strong>農林漁業用</strong>の建築物（農家の住宅を含む）のための開発行為 ── ただし<strong>市街化区域では対象外</strong>（規模要件で判断）</li>
<li>駅舎・図書館・公民館・変電所など<strong>公益上必要な建築物</strong>のための開発行為（学校・病院・社会福祉施設は含まれない）</li>
<li>都市計画事業・土地区画整理事業などの<strong>施行として</strong>行うもの</li>
<li><strong>非常災害</strong>のための応急措置、<strong>通常の管理行為</strong>・軽易な行為</li></ul>
<div class="hbox"><span class="term">判断の順番</span>① 開発行為か？ → ② 例外（農林漁業用・公益・事業の施行・災害）か？ → ③ 区域ごとの規模未満か？</div>
<h3>許可後の流れ</h3>
<ul><li>開発区域内では、工事完了の<strong>公告前</strong>は原則として建築できない</li>
<li>許可申請の前に、関係する公共施設の管理者と<strong>協議・同意</strong></li></ul>
`},

{ id:'kenchiku', field:'horei', icon:'🏢', title:'建築基準法', sub:'道路・用途制限・建蔽率・容積率', gram:`
<h3>接道義務</h3>
<p>建築物の敷地は、原則として幅員<strong>4m以上</strong>の道路に<strong>2m以上</strong>接していなければなりません。4m未満でも、特定行政庁が指定したものは道路とみなされ（2項道路）、道路の中心線から<strong>2m</strong>後退した線が道路境界線とみなされます。</p>
<h3>建蔽率の緩和（+1/10）</h3>
<ul><li><strong>防火地域内</strong>の耐火建築物等</li>
<li><strong>準防火地域内</strong>の耐火建築物等・準耐火建築物等</li>
<li>特定行政庁が指定する<strong>角地</strong></li>
<li>両方満たせば <strong>+2/10</strong></li></ul>
<div class="hbox"><span class="term">制限なし</span>建蔽率が<strong>8/10</strong>の地域で、<strong>防火地域内</strong>にある<strong>耐火建築物等</strong> → 建蔽率の制限が適用されない。</div>
<h3>容積率と前面道路</h3>

  choices:[

{ id:'o-chihouzei-1', unit:'chihouzei', kind:'single', polarity:'correct',

{ id:'o-chihouzei-2', unit:'chihouzei', kind:'single', polarity:'wrong',
  stem:'不動産取得税及び固定資産税に関する次の記述のうち、誤っているものはどれか。',
  choices:[

  answer:2,

    '改築で価格が増加した場合は、その増加分について取得とみなして課税される。これが誤り。',
    '法人の合併は非課税。',
    '標準税率は1.4%。'],
  exp:'改築による価格の増加は「取得とみなす」。' },

/* ───────────── 景品表示法（免除科目） ───────────── */
{ id:'o-keihyo-1', unit:'keihyo', kind:'single', polarity:'correct',
  stem:'宅地建物取引業者が行う広告に関する次の記述のうち、不当景品類及び不当表示防止法（不動産の表示に関する公正競争規約を含む）の規定によれば、正しいものはどれか。',
  choices:[
    '徒歩による所要時間は、道路距離80mにつき1分間を要するものとして算出し、1分未満の端数が生じたときは切り捨てて表示する。',
    '建築後1年未満の建物であっても、居住の用に供されたことがあるものは、「新築」と表示することはできない。',
    '実際には取引する意思のない物件であっても、問い合わせを集める目的であれば、広告に掲載しても不当表示にはあたらない。',

  answer:2,
  why:[
    '1分未満の端数は「1分」として計算（切り上げ）。',
    '「新築」は建築後1年未満、かつ、居住の用に供されたことがないもの。正しい。',
    '取引する意思のない物件の広告はおとり広告として禁止。',
    '最上級を意味する用語は、合理的な根拠を示す資料があり、根拠となる事実を併記する場合などに限られる。'],
  exp:'徒歩は80m＝1分・端数切り上げ。新築＝1年未満＋未入居。' }
];

</script>

<script>
/* ═══════════════════════════════════════════════════════════
   KEYSTONE 宅建 — エンジン
   ・コンテンツ：data/units.js（UNITS）・data/questions.js（ORIG_Q）
   ・取り込んだ過去問：localStorage（GitHubには載らない）
   ═══════════════════════════════════════════════════════════ */
const VERSION='2026-10-07a';
const LS={ get(k,d){ try{ const v=JSON.parse(localStorage.getItem(k)); return v==null?d:v; }catch(e){ return d; } },
           set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); return true; }catch(e){ toast('保存できませんでした（容量不足の可能性）',true); return false; } } };
const K={ hist:'ks_hist', ox:'ks_ox', keep:'ks_keep', exams:'ks_exams', imports:'ks_imports', set:'ks_set', last:'ks_last' };

const FIELDS={
  kenri:{ name:'権利関係',     icon:'⚖️', n:14, color:'var(--f-kenri)' },
  horei:{ name:'法令上の制限', icon:'🏗️', n:8,  color:'var(--f-horei)' },
  zei:  { name:'税・その他',   icon:'🧾', n:8,  color:'var(--f-zei)' },
  gyoho:{ name:'宅建業法',     icon:'🏢', n:20, color:'var(--f-gyoho)' }
};
const FORDER=['kenri','gyoho','horei','zei'];        // 学習の並び
const EXAM_ORDER=['kenri','horei','zei','gyoho'];    // 本試験の並び（問1〜）
/* 本試験の問番号 → 分野（例年の配置） */
function fieldOfNo(n){ if(n<=14) return 'kenri'; if(n<=22) return 'horei'; if(n<=25) return 'zei'; if(n<=45) return 'gyoho'; return 'zei'; }
const MARK=['1','2','3','4'];
const SL='アイウエオカ';

const UNITS_ = (window.UNITS||[]);
const UMAP={}; UNITS_.forEach(u=>UMAP[u.id]=u);
let ALLQ=[], QMAP={};
let SETS=[];   // 取り込みセット

function settings(){ return Object.assign({ pass:37, menjo:false }, LS.get(K.set,{})); }

/* ── 問題の正規化 ── */
function normQ(q, src, setId){
  const o=Object.assign({},q);
  o.src=src; o.setId=setId||null;
  o.ans=(typeof q.answer==='number')? q.answer-1 : 0;   // データは 1〜4、内部は 0〜3
  if(!o.field && o.no) o.field=fieldOfNo(o.no);
  if(!o.field && o.unit && UMAP[o.unit]) o.field=UMAP[o.unit].field;
  if(!FIELDS[o.field]) o.field='kenri';
  o.kind=o.kind||(o.stmts&&o.stmts.length?'count':'single');
  o.why=o.why||[]; o.stmts=o.stmts||[];
  return o;
}
function loadImports(){ return LS.get(K.imports,[]); }
function rebuild(){
  SETS=loadImports();
  ALLQ=(window.ORIG_Q||[]).map(q=>normQ(q,'orig'));
  SETS.forEach(s=>s.questions.forEach(q=>ALLQ.push(normQ(q,'imp',s.id))));
  QMAP={}; ALLQ.forEach(q=>QMAP[q.id]=q);
}

/* ── ○× の肢を問題から取り出す ── */
function stmtsOf(q){
  if(q.stmts&&q.stmts.length) return q.stmts.map((s,i)=>({ key:q.id+'#s'+i, qid:q.id, t:s.t, ok:!!s.ok, why:s.why||'', lbl:SL[i] }));
  if(q.polarity==='correct'||q.polarity==='wrong')
    return q.choices.map((c,i)=>({ key:q.id+'#c'+i, qid:q.id, t:c, ok:q.polarity==='correct'? i===q.ans : i!==q.ans, why:q.why[i]||'', lbl:MARK[i] }));
  return [];
}

/* ── 記録 ── */
function hist(){ return LS.get(K.hist,{}); }
function recQ(qid,ok){ const h=hist(); const r=h[qid]||{n:0,c:0}; r.n++; if(ok) r.c++; r.last=ok?1:0; r.t=Date.now(); h[qid]=r; LS.set(K.hist,h); }
function oxh(){ return LS.get(K.ox,{}); }
function recOX(key,ok){ const h=oxh(); const r=h[key]||{n:0,c:0}; r.n++; if(ok) r.c++; r.last=ok?1:0; r.t=Date.now(); h[key]=r; LS.set(K.ox,h); }
function keeps(){ return LS.get(K.keep,{}); }
function isKept(id){ return !!keeps()[id]; }
function toggleKeep(id,btn){ const k=keeps(); if(k[id]) delete k[id]; else k[id]=Date.now(); LS.set(K.keep,k); if(btn){ btn.classList.toggle('on',!!k[id]); btn.textContent=k[id]?'★ キープ中':'☆ キープ'; } renderSidebar(); }
function fieldStats(field){ const h=hist(); let n=0,c=0,tried=0,total=0; ALLQ.forEach(q=>{ if(field&&q.field!==field) return; total++; const r=h[q.id]; if(r){ tried++; n++; c+=r.last; } }); return {tried,total,rate:n?c/n:null}; }
function unitStats(uid){ const h=hist(); let tried=0,ok=0; const qs=ALLQ.filter(q=>q.unit===uid); qs.forEach(q=>{ const r=h[q.id]; if(r){ tried++; ok+=r.last; } }); return {total:qs.length,tried,ok}; }

/* ── 汎用 ── */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function rich(s){ return String(s==null?'':s).replace(/\n/g,'<br>'); }   // データは自分のものなので簡易HTMLを許可
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function pct(x){ return x==null?'—':Math.round(x*100)+'%'; }
function fchip(f){ return '<span class="chip '+f+'">'+FIELDS[f].icon+' '+FIELDS[f].name+'</span>'; }
function srcLabel(q){ if(q.src==='imp'){ const s=SETS.find(x=>x.id===q.setId); return (s?s.name:'取り込み')+(q.no?' 問'+q.no:''); } return 'オリジナル'+(q.exam?'（'+q.exam+'型）':''); }
function toast(m,err){ const t=document.getElementById('toast'); t.textContent=m; t.className='show'+(err?' err':''); clearTimeout(t._t); t._t=setTimeout(()=>t.className='',2400); }
function $c(){ return document.getElementById('content'); }
function openModal(title,html){ document.getElementById('modal-title').textContent=title; document.getElementById('modal-body').innerHTML=html; document.getElementById('modal').classList.add('show'); }
function closeModal(){ document.getElementById('modal').classList.remove('show'); }
function fmtTime(s){ s=Math.max(0,s); const h=Math.floor(s/3600), m=Math.floor(s%3600/60), ss=s%60; return (h?h+':'+String(m).padStart(2,'0'):m)+':'+String(ss).padStart(2,'0'); }
function fmtDate(t){ const d=new Date(t); return (d.getMonth()+1)+'/'+d.getDate()+' '+d.getHours()+':'+String(d.getMinutes()).padStart(2,'0'); }

/* ═══════════ ナビゲーション ═══════════ */
let VIEW='home', VIEW_ARG=null;
const NAV=[ ['home','🏠','ホーム'], ['past','📚','過去問'], ['drill','🎯','分野別演習'], ['ox','⭕','○×一問一答'], ['mock','⏱','模擬試験'], ['review','🔁','復習'], ['stats','📊','記録'], ['import','📥','取り込み'] ];
function go(view,arg){
  if(EX && !confirm('試験を中断しますか？（記録は残りません）')) return;
  EX=null; stopTimer(); VIEW=view; VIEW_ARG=arg;
  document.body.classList.add('in-content');
  const map={ home:renderHome, unit:renderUnit, past:renderPast, drill:renderDrill, ox:renderOXMenu, mock:renderMock, review:renderReview, stats:renderStats, import:renderImport, settings:renderSettings };
  (map[view]||renderHome)(arg);
  renderSidebar();
  const t=(NAV.find(n=>n[0]===view)||[])[2] || (view==='unit'&&UMAP[arg]?UMAP[arg].title:view==='settings'?'設定':'');
  document.getElementById('crumb-t').textContent=t||'';
  $c().scrollTop=0;
}
function setCrumb(t){ document.getElementById('crumb-t').textContent=t||''; }
function mobileBack(){ if(EX && !confirm('試験を中断しますか？（記録は残りません）')) return; EX=null; stopTimer(); document.body.classList.remove('in-content'); }

function renderSidebar(){
  document.getElementById('sb-nav').innerHTML=NAV.map(n=>'<button class="navbtn'+(VIEW===n[0]?' on':'')+'" onclick="go(\''+n[0]+'\')">'+n[1]+' '+n[2]+'</button>').join('');
  let h='';
  FORDER.forEach(f=>{
    const us=UNITS_.filter(u=>u.field===f); if(!us.length) return;
    h+='<div class="grp-lbl" style="color:'+FIELDS[f].color+'">'+FIELDS[f].icon+' '+FIELDS[f].name+'<span class="gn">本試験 '+FIELDS[f].n+'問</span></div>';
    us.forEach(u=>{ const s=unitStats(u.id); const m=s.tried? s.ok+'/'+s.total : (s.total? '0/'+s.total:'');
      h+='<button class="ubtn'+(VIEW==='unit'&&VIEW_ARG===u.id?' active':'')+'" onclick="go(\'unit\',\''+u.id+'\')"><span class="uicon">'+(u.icon||'•')+'</span><span class="utxt"><span class="ut-main">'+esc(u.title)+'</span>'+(u.sub?'<span class="ut-sub">'+esc(u.sub)+'</span>':'')+'</span><span class="umeter'+(s.total&&s.ok===s.total?' good':'')+'">'+m+'</span></button>'; });
  });
  document.getElementById('sb-list').innerHTML=h;
}

/* ═══════════ ホーム ═══════════ */
function renderHome(){
  const h=hist(); const tried=Object.keys(h).filter(k=>QMAP[k]).length;
  const wrong=ALLQ.filter(q=>h[q.id]&&h[q.id].last===0).length;
  const ex=LS.get(K.exams,[]); const best=ex.filter(e=>e.total>=45).reduce((m,e)=>Math.max(m,e.score),0);
  const oxN=Object.keys(oxh()).length;
  const st=settings();
  let html='<div class="wrap"><h2 class="pg">宅建士 学習</h2><div class="pg-sub">試験：例年10月第3日曜・50問・四肢択一・120分（登録講習修了者は問46〜50免除・110分）</div>';
  html+='<div class="hero">'
    +'<div class="kpi"><div class="k-l">取り組んだ問題</div><div class="k-v">'+tried+'<small>/ '+ALLQ.length+'</small></div></div>'
    +'<div class="kpi"><div class="k-l">要復習</div><div class="k-v" style="color:'+(wrong?'var(--red)':'inherit')+'">'+wrong+'<small>問</small></div></div>'
    +'<div class="kpi"><div class="k-l">○×に挑戦</div><div class="k-v">'+oxN+'<small>肢</small></div></div>'
    +'<div class="kpi"><div class="k-l">50問演習の最高点</div><div class="k-v">'+(best||'—')+'<small>/ 50（目標 '+st.pass+'）</small></div></div></div>';
  html+='<div class="mode-grid">'
    +mcard('📚','過去問（年度別）', SETS.length? SETS.length+'セット取り込み済み。本試験の時間・問題順で解く' : '購入した過去問を取り込むとここに並びます','past')
    +mcard('🎯','分野別演習','分野と問題数を選んで、1問ずつ解説つきで解く','drill')
    +mcard('⭕','○×一問一答','4つの肢を1つずつ○×で。スキマ時間向け','ox')
    +mcard('⏱','模擬試験','全問題から本試験の配分（14/8/8/20）で出題','mock')
    +mcard('🔁','復習','間違えた問題・★キープした問題だけを解き直す','review')
    +mcard('📊','記録','分野別の正答率と演習の履歴','stats')
    +'</div>';
  html+='<div class="sec-h">分野別の正答率（直近の解答）</div><div class="fbars">'+FORDER.map(f=>{ const s=fieldStats(f); const r=s.rate; return '<div class="fbar"><span>'+FIELDS[f].icon+' '+FIELDS[f].name+'</span><div class="tr"><div class="fl" style="width:'+(r==null?0:r*100)+'%;background:'+FIELDS[f].color+'"></div></div><span class="v">'+pct(r)+' · '+s.tried+'/'+s.total+'</span></div>'; }).join('')+'</div>';
  html+='<div class="sec-h">単元から学ぶ</div><div class="pg-sub" style="margin-bottom:0">左の一覧（スマホは「‹ メニュー」）から単元を選ぶと、解説→問題→○× の順に進めます。</div>';
  html+='</div>';
  $c().innerHTML=html;
}
function mcard(ic,name,desc,view,dis){ return '<button class="mode-card" '+(dis?'disabled':'')+' onclick="go(\''+view+'\')"><div class="mode-ic">'+ic+'</div><div class="mode-name">'+name+'</div><div class="mode-desc">'+desc+'</div></button>'; }

/* ═══════════ 単元 ═══════════ */
let unitTab='g';
function renderUnit(uid){
  const u=UMAP[uid]; if(!u){ go('home'); return; }
  LS.set(K.last,uid);
  const qs=ALLQ.filter(q=>q.unit===uid);
  const oxs=[].concat(...qs.map(stmtsOf));
  let html='<div class="wrap"><h2 class="pg">'+(u.icon||'')+' '+esc(u.title)+' '+fchip(u.field)+(u.menjo?'<span class="chip gray">免除科目</span>':'')+'</h2>'+(u.sub?'<div class="pg-sub" style="margin-bottom:8px">'+esc(u.sub)+'</div>':'')
    +'<div class="tabs"><button class="tab'+(unitTab==='g'?' on':'')+'" onclick="unitTab=\'g\';renderUnit(\''+uid+'\')">解説</button><button class="tab'+(unitTab==='q'?' on':'')+'" onclick="unitTab=\'q\';renderUnit(\''+uid+'\')">問題（'+qs.length+'）</button><button class="tab'+(unitTab==='x'?' on':'')+'" onclick="unitTab=\'x\';renderUnit(\''+uid+'\')">○×（'+oxs.length+'）</button></div></div>';
  if(unitTab==='g'){ html+='<div class="gram">'+(u.gram||'<p>解説は準備中です。</p>')+'</div><div class="qnav"><button class="btn p" onclick="unitTab=\'q\';renderUnit(\''+uid+'\')">問題を解く ›</button></div>'; $c().innerHTML=html; return; }

/* ═══════════ 練習モード（1問ずつ・即採点） ═══════════ */
let PR=null;
function startPractice(ids,title,opt){
  opt=opt||{};
  if(!opt.append) setCrumb(title);
  PR={ ids:ids.slice(), i:0, ok:0, done:[], title, append:!!opt.append, base: opt.append? $c().innerHTML : '' };
  showPQ();
}
function prHost(){ if(PR.append){ let h=document.getElementById('pr-host'); if(!h){ $c().insertAdjacentHTML('beforeend','<div id="pr-host"></div>'); h=document.getElementById('pr-host'); } return h; } return $c(); }
function qBody(q,state){
  /* state: {sel, reveal, mode:'practice'|'exam'|'view'} */
  let h='<div class="qcard"><div class="qmeta">'+fchip(q.field)+(q.unit&&UMAP[q.unit]?'<span class="chip gray">'+esc(UMAP[q.unit].title)+'</span>':'')+'<span class="src">'+esc(srcLabel(q))+'</span></div>';
  h+='<div class="qq">'+rich(q.stem)+'</div>';
  if(q.stmts.length){ h+='<div class="stmts">'+q.stmts.map((s,i)=>'<div class="stmt"><span class="sl">'+SL[i]+'</span>'+(state.reveal?'<span class="sj '+(s.ok?'o':'x')+'">'+(s.ok?'○':'×')+'</span>':'')+'<span>'+rich(s.t)+(state.reveal&&s.why?'<div style="font-size:12.5px;color:var(--text-dim);margin-top:2px">'+rich(s.why)+'</div>':'')+'</span></div>').join('')+'</div>'; }
  h+='<div class="choices">';
  q.choices.forEach((c,i)=>{
    let cls='choice';
    if(state.reveal){ if(i===q.ans) cls+=' ok'; else if(i===state.sel) cls+=' ng'; }
    else if(i===state.sel) cls+=' sel';
    const on = state.mode==='practice'? 'answerP('+i+')' : state.mode==='exam'? 'exPick('+i+')' : '';
    h+='<button class="'+cls+'" '+(state.reveal||state.mode==='view'?'disabled':'')+' onclick="'+on+'"><span class="ck">'+MARK[i]+'</span><span>'+rich(c)+'</span></button>';
    if(state.reveal && q.why[i]){ const tf = stmtTruth(q,i); h+='<div class="cwhy show">'+(tf==null?'':'<b class="'+(tf?'o':'x')+'">'+(tf?'○ 正しい':'× 誤り')+'</b>　')+rich(q.why[i])+'</div>'; }
  });
  h+='</div></div>';
  if(state.reveal){ const ok=state.sel===q.ans;
    h+='<div class="fb '+(state.sel==null?'ng':ok?'ok':'ng')+'"><div class="fb-h">'+(state.sel==null?'未解答':ok?'正解':'不正解')+'　正解は <b>'+MARK[q.ans]+'</b></div><div class="fb-body">'+rich(q.exp||'')+'</div></div>'; }
  return h;
}
function isMenjoQ(q){ return (q.src==='imp'&&q.no>=46&&q.no<=50) || !!(q.unit&&UMAP[q.unit]&&UMAP[q.unit].menjo); }
function stmtTruth(q,i){ if(q.polarity==='correct') return i===q.ans; if(q.polarity==='wrong') return i!==q.ans; return null; }
function showPQ(sel,reveal){
  const q=QMAP[PR.ids[PR.i]]; const n=PR.ids.length;
  let h='<div class="qprog"><div class="qtrack"><div class="qfill" style="width:'+(PR.i/n*100)+'%"></div></div><span class="qlbl">'+(PR.i+1)+' / '+n+(PR.append?'':'　'+esc(PR.title))+'</span></div>';

  h+='<div class="qnav"><button class="keepbtn'+(isKept(q.id)?' on':'')+'" onclick="toggleKeep(\''+q.id+'\',this)">'+(isKept(q.id)?'★ キープ中':'☆ キープ')+'</button><span class="spacer"></span>';

  else if(!PR.append) $c().scrollTop=0;
}
function answerP(i){ const q=QMAP[PR.ids[PR.i]]; const ok=i===q.ans; recQ(q.id,ok); if(ok) PR.ok++; PR.done.push({id:q.id,sel:i,ok}); showPQ(i,true); }
function nextP(){ PR.i++; if(PR.i<PR.ids.length){ showPQ(); return; }
  const n=PR.ids.length, wrongIds=PR.done.filter(d=>!d.ok).map(d=>d.id);

  h+=PR.done.map((d,k)=>revItem(QMAP[d.id],d.sel,k+1)).join('');
  prHost().innerHTML=h; renderSidebar();
}
function revItem(q,sel,num){ const ok=sel===q.ans; return '<div class="rev-item '+(ok?'ok':'no')+'" onclick="viewQ(\''+q.id+'\','+(sel==null?'null':sel)+')"><div class="qmeta" style="margin-bottom:0">'+(num?'<b style="font-size:12px">'+num+'</b>':'')+fchip(q.field)+'<span class="src">'+esc(srcLabel(q))+'</span></div><div class="rq">'+esc(String(q.stem).replace(/<[^>]+>/g,''))+'</div><div class="rl">あなた：<span class="'+(ok?'yes':'bad')+'">'+(sel==null?'未解答':MARK[sel])+'</span>　正解：<span class="yes">'+MARK[q.ans]+'</span>　<span style="color:var(--accent)">解説 ›</span></div></div>'; }
function viewQ(id,sel){ const q=QMAP[id]; openModal(srcLabel(q), qBody(q,{sel:sel,reveal:true,mode:'view'})+'<div class="qnav"><button class="keepbtn'+(isKept(id)?' on':'')+'" onclick="toggleKeep(\''+id+'\',this)">'+(isKept(id)?'★ キープ中':'☆ キープ')+'</button></div>'); }

/* ═══════════ ○× 一問一答 ═══════════ */
let OX=null;
function startOX(items,title,opt){ opt=opt||{}; if(!opt.append) setCrumb(title); OX={ items, i:0, ok:0, title, append:!!opt.append, wrong:[] }; showOX(); }
function oxHost(){ if(OX.append){ let h=document.getElementById('pr-host'); if(!h){ $c().insertAdjacentHTML('beforeend','<div id="pr-host"></div>'); h=document.getElementById('pr-host'); } return h; } return $c(); }
function showOX(pick){

  const rev=pick!=null;
  h+='<div class="ox-btns"><button class="ox-b o'+(rev&&pick===true?' hit':'')+'" '+(rev?'disabled':'')+' onclick="answerOX(true)">○</button><button class="ox-b x'+(rev&&pick===false?' hit':'')+'" '+(rev?'disabled':'')+' onclick="answerOX(false)">×</button></div></div>';
  if(rev){ const ok=pick===it.ok; h+='<div class="fb '+(ok?'ok':'ng')+'"><div class="fb-h">'+(ok?'正解':'不正解')+'　この肢は <b>'+(it.ok?'○ 正しい':'× 誤り')+'</b></div><div class="fb-body">'+rich(it.why||'（解説なし）')+'</div></div>'
    +'<div class="qnav"><button class="btn sm" onclick="viewQ(\''+it.qid+'\',null)">元の問題を見る</button><span class="spacer"></span><button class="btn p" onclick="nextOX()">'+(OX.i+1<n?'次へ ›':'結果を見る')+'</button></div>'; }
  oxHost().innerHTML=h;
}
function answerOX(v){ const it=OX.items[OX.i]; const ok=v===it.ok; recOX(it.key,ok); if(ok) OX.ok++; else OX.wrong.push(it); showOX(v); }
function nextOX(){ OX.i++; if(OX.i<OX.items.length){ showOX(); return; }
  const n=OX.items.length; window._oxWrong=OX.wrong;
  oxHost().innerHTML='<div class="result-badge '+(OX.ok/n>=0.8?'pass':'fail')+'"><div class="rb-big">'+OX.ok+' / '+n+'</div><div class="rb-sub">'+esc(OX.title)+'　正答率 '+Math.round(OX.ok/n*100)+'%</div></div><div class="row">'+(OX.wrong.length?'<button class="btn p" onclick="startOX(shuffle(window._oxWrong),\'○× 間違えた肢\')">✗ 間違えた '+OX.wrong.length+'肢をもう一度</button>':'')+'<button class="btn" onclick="go(\'ox\')">○×メニューへ</button></div>';
}
function renderOXMenu(){

  html+='<button class="mode-card" '+(all.length?'':'disabled')+' onclick="oxStart(\'all\')"><div class="mode-ic">🎲</div><div class="mode-name">全分野ミックス</div><div class="mode-desc">ランダム20肢</div></button>';

}
function oxStart(f){ const all=[].concat(...ALLQ.map(stmtsOf)); const h=oxh(); let pool;
  if(f==='wrong') pool=all.filter(s=>h[s.key]&&h[s.key].last===0); else if(f==='all') pool=all; else pool=all.filter(s=>QMAP[s.qid].field===f);

let drillF={kenri:1,gyoho:1,horei:1,zei:1}, drillN=10, drillSrc='all', drillOrder='rand';
function renderDrill(){

function drillPool(){ return ALLQ.filter(q=>drillF[q.field] && (drillSrc==='all'||q.src===drillSrc)); }
function drillGo(){ const h=hist(); let p=shuffle(drillPool());
  if(drillOrder==='new') p.sort((a,b)=>(h[a.id]?1:0)-(h[b.id]?1:0));
  if(drillOrder==='weak'){ const sc=q=>{ const r=h[q.id]; if(!r) return 0.5; return r.last===0?0:(r.c/r.n); }; p.sort((a,b)=>sc(a)-sc(b)); }
  startPractice(p.slice(0,drillN).map(q=>q.id),'分野別演習'); }

/* ═══════════ 本試験モード（年度別・模試共通） ═══════════ */
let EX=null, TIMER=null;
function stopTimer(){ if(TIMER){ clearInterval(TIMER); TIMER=null; } }
function startExam(ids,title,minutes,opt){
  opt=opt||{}; setCrumb(title);
  EX={ ids, title, sel:new Array(ids.length).fill(null), flag:new Array(ids.length).fill(false), i:0, remain:minutes*60, total:minutes*60, start:Date.now(), menjo:!!opt.menjo, setId:opt.setId||null, paused:false };
  stopTimer(); TIMER=setInterval(()=>{ if(!EX||EX.paused) return; EX.remain--; const t=document.getElementById('ex-timer'); if(t){ t.textContent='⏱ '+fmtTime(EX.remain); t.classList.toggle('warn',EX.remain<=600); } if(EX.remain<=0){ stopTimer(); toast('時間切れです。採点します'); finishExam(); } },1000);
  showEx();
}
function showEx(){
  const i=EX.i, q=QMAP[EX.ids[i]], n=EX.ids.length, una=EX.sel.filter(v=>v==null).length;
  let h='<div class="exbar"><span class="timer'+(EX.remain<=600?' warn':'')+'" id="ex-timer">⏱ '+fmtTime(EX.remain)+'</span><b style="font-size:13px">問'+(q.no||i+1)+'</b><span class="qlbl">'+(i+1)+'/'+n+'　未解答 '+una+'</span><span class="spacer" style="flex:1"></span><button class="btn sm" onclick="exPause()">'+(EX.paused?'▶ 再開':'⏸ 一時停止')+'</button><button class="btn sm p" onclick="exConfirm()">採点する</button></div>';
  if(EX.paused){ $c().innerHTML=h+'<div class="empty wrap">一時停止中です。</div>'; return; }
  h+='<div class="grid50">'+EX.ids.map((id,k)=>'<button class="gcell'+(EX.sel[k]!=null?' ans':'')+(k===i?' cur':'')+(EX.flag[k]?' flag':'')+'" onclick="exGo('+k+')">'+(QMAP[id].no||k+1)+'</button>').join('')+'</div>';
  h+=qBody(q,{sel:EX.sel[i],reveal:false,mode:'exam'});
  h+='<div class="qnav"><button class="btn sm" onclick="exFlag()">'+(EX.flag[i]?'● 見直し解除':'○ 後で見直す')+'</button><span class="spacer"></span><button class="btn" '+(i?'':'disabled')+' onclick="exGo('+(i-1)+')">‹ 前へ</button><button class="btn p" '+(i+1<n?'':'disabled')+' onclick="exGo('+(i+1)+')">次へ ›</button></div>';
  $c().innerHTML=h;
}
function exPick(k){ EX.sel[EX.i]=EX.sel[EX.i]===k?null:k; showEx(); }
function exGo(k){ EX.i=k; showEx(); $c().scrollTop=0; }
function exFlag(){ EX.flag[EX.i]=!EX.flag[EX.i]; showEx(); }
function exPause(){ EX.paused=!EX.paused; showEx(); }
function exConfirm(){ const una=EX.sel.filter(v=>v==null).length; if(una && !confirm('未解答が '+una+' 問あります。採点しますか？')) return; if(!una && !confirm('採点しますか？')) return; stopTimer(); finishExam(); }
function finishExam(){
  const st=settings(); const by={}; EXAM_ORDER.forEach(f=>by[f]={c:0,n:0});
  let score=0;
  EX.ids.forEach((id,k)=>{ const q=QMAP[id]; const ok=EX.sel[k]===q.ans; if(EX.sel[k]!=null) recQ(id,ok); if(ok) score++; by[q.field].n++; if(ok) by[q.field].c++; });
  const bonus=EX.menjo?5:0; const total=EX.ids.length+bonus; score+=bonus;
  const full=total>=50; const pass=full? score>=st.pass : score/total>=st.pass/50;
  const used=EX.total-EX.remain;
  const ex=LS.get(K.exams,[]); ex.unshift({ t:Date.now(), title:EX.title, score, total, by, used, menjo:EX.menjo }); LS.set(K.exams,ex.slice(0,200));
  window._exRes={ ids:EX.ids, sel:EX.sel };
  let h='<div class="result-badge '+(pass?'pass':'fail')+'"><div class="rb-big">'+score+' / '+total+'</div><div class="rb-sub">'+esc(EX.title)+'　目標 '+(full?st.pass+'点':Math.round(st.pass/50*100)+'%')+(EX.menjo?'（免除5点を含む）':'')+'　所要 '+fmtTime(used)+'</div></div>';
  h+='<div class="fbars wrap" style="margin-bottom:18px">'+EXAM_ORDER.filter(f=>by[f].n).map(f=>{ const r=by[f].c/by[f].n; return '<div class="fbar"><span>'+FIELDS[f].icon+' '+FIELDS[f].name+'</span><div class="tr"><div class="fl" style="width:'+r*100+'%;background:'+FIELDS[f].color+'"></div></div><span class="v">'+by[f].c+' / '+by[f].n+'</span></div>'; }).join('')+'</div>';
  const wrongIds=EX.ids.filter((id,k)=>EX.sel[k]!==QMAP[id].ans);
  h+='<div class="row" style="margin-bottom:12px">'+(wrongIds.length?'<button class="btn p" onclick="startPractice('+esc(JSON.stringify(wrongIds))+',\'試験の間違い直し\')">✗ 間違えた '+wrongIds.length+'問を解説つきで解き直す</button>':'')+'<button class="btn" onclick="go(\'home\')">ホームへ</button></div>';
  h+='<div class="grid50">'+EX.ids.map((id,k)=>'<button class="gcell '+(EX.sel[k]==null?'ng':EX.sel[k]===QMAP[id].ans?'ok':'ng')+'" onclick="viewQ(\''+id+'\','+(EX.sel[k]==null?'null':EX.sel[k])+')">'+(QMAP[id].no||k+1)+'</button>').join('')+'</div>';
  h+=EX.ids.map((id,k)=>revItem(QMAP[id],EX.sel[k],QMAP[id].no||k+1)).join('');
  EX=null; $c().innerHTML='<div>'+h+'</div>'; $c().scrollTop=0; renderSidebar();
}

/* ═══════════ 過去問（取り込みセット） ═══════════ */

function setQs(id){ return ALLQ.filter(q=>q.setId===id).sort((a,b)=>(a.no||0)-(b.no||0)); }
function pastPractice(id){ const s=SETS.find(x=>x.id===id); startPractice(setQs(id).map(q=>q.id), s.name); }
function pastExam(id){ const s=SETS.find(x=>x.id===id); const st=settings(); let qs=setQs(id);
  const isFull=qs.length>=50; const menjo=st.menjo&&isFull; if(menjo) qs=qs.filter(q=>!(q.no>=46&&q.no<=50));
  const min=isFull?(menjo?110:120):Math.max(5,Math.round(qs.length*2.4));
  startExam(qs.map(q=>q.id), s.name+' 本試験', min, {menjo, setId:id}); }

/* ═══════════ 模擬試験 ═══════════ */
let mockSrc='all';
function renderMock(){
  const st=settings(); const pool=ALLQ.filter(q=>mockSrc==='all'||q.src===mockSrc);
  const have={}; FORDER.forEach(f=>have[f]=pool.filter(q=>q.field===f).length);
  let html='<div class="wrap"><h2 class="pg">⏱ 模擬試験</h2><div class="pg-sub">全問題から本試験の配分でランダムに出題し、時間を計って解きます。問題が足りない分野は、ある分だけ出題します。</div>';
  html+='<div class="sec-h">出典</div><div class="seg">'+[['all','すべて'],['orig','オリジナル'],['imp','取り込み']].map(s=>'<button class="'+(mockSrc===s[0]?'on':'')+'" onclick="mockSrc=\''+s[0]+'\';renderMock()">'+s[1]+'</button>').join('')+'</div>';
  html+='<div class="sec-h">配分と手持ちの問題数</div><div class="fbars">'+EXAM_ORDER.map(f=>{ const need=(f==='zei'&&st.menjo)?3:FIELDS[f].n; return '<div class="fbar"><span>'+FIELDS[f].icon+' '+FIELDS[f].name+'</span><div class="tr"><div class="fl" style="width:'+Math.min(100,have[f]/need*100)+'%;background:'+FIELDS[f].color+'"></div></div><span class="v">'+Math.min(have[f],need)+' / '+need+'問</span></div>'; }).join('')+'</div>';
  html+='<div class="sec-h">形式</div><div class="mode-grid">'
    +'<button class="mode-card" onclick="mockGo(1)"><div class="mode-ic">📝</div><div class="mode-name">フル（'+(st.menjo?'45問・110分':'50問・120分')+'）</div><div class="mode-desc">本試験と同じ配分・時間</div></button>'
    +'<button class="mode-card" onclick="mockGo(0.5)"><div class="mode-ic">⏳</div><div class="mode-name">ハーフ（25問・60分）</div><div class="mode-desc">平日の2時間に収まる長さ</div></button>'
    +'<button class="mode-card" onclick="mockGo(\'gyoho\')"><div class="mode-ic">🏢</div><div class="mode-name">宅建業法だけ（20問・45分）</div><div class="mode-desc">得点源の業法を満点狙いで</div></button></div></div>';
  $c().innerHTML=html;
}
function mockGo(r){
  const st=settings(); const pool=ALLQ.filter(q=>mockSrc==='all'||q.src===mockSrc); const h=hist();
  const pick=(f,n)=>{ const p=shuffle(pool.filter(q=>q.field===f && !(st.menjo&&r===1&&isMenjoQ(q)))); p.sort((a,b)=>(h[a.id]?1:0)-(h[b.id]?1:0)); return p.slice(0,n); };
  let ids=[], min;
  if(r==='gyoho'){ ids=pick('gyoho',20); min=45; }
  else { EXAM_ORDER.forEach(f=>{ let need=FIELDS[f].n; if(f==='zei'&&st.menjo&&r===1) need=3; ids=ids.concat(pick(f,Math.round(need*r))); }); min=r===1?(st.menjo?110:120):60; }
  if(!ids.length){ toast('問題がありません',true); return; }
  const scale=ids.length/(r==='gyoho'?20:r===1?(st.menjo?45:50):25); min=Math.max(5,Math.round(min*Math.min(1,scale)));
  startExam(ids.map(q=>q.id), r==='gyoho'?'模試（宅建業法）':r===1?'模擬試験（フル）':'模擬試験（ハーフ）', min, {menjo: r===1&&st.menjo&&ids.length>=45});
}

/* ═══════════ 復習 ═══════════ */
function renderReview(){
  const h=hist(), k=keeps();
  const wrong=ALLQ.filter(q=>h[q.id]&&h[q.id].last===0);
  const kept=ALLQ.filter(q=>k[q.id]);
  const weak=ALLQ.filter(q=>h[q.id]&&h[q.id].n>=2&&h[q.id].c/h[q.id].n<0.6);
  let html='<div class="wrap"><h2 class="pg">🔁 復習</h2><div class="pg-sub">「間違えた問題」は直近の解答が不正解のもの。正解すると自動でリストから外れます。</div><div class="mode-grid">'
    +'<button class="mode-card" '+(wrong.length?'':'disabled')+' onclick="startPractice(shuffle(window._rv.w),\'間違えた問題\')"><div class="mode-ic">✗</div><div class="mode-name">間違えた問題</div><div class="mode-desc">'+wrong.length+'問</div></button>'
    +'<button class="mode-card" '+(kept.length?'':'disabled')+' onclick="startPractice(shuffle(window._rv.k),\'★キープ\')"><div class="mode-ic">★</div><div class="mode-name">キープした問題</div><div class="mode-desc">'+kept.length+'問</div></button>'
    +'<button class="mode-card" '+(weak.length?'':'disabled')+' onclick="startPractice(shuffle(window._rv.p),\'苦手な問題\')"><div class="mode-ic">🧩</div><div class="mode-name">苦手な問題</div><div class="mode-desc">2回以上解いて正答率60%未満：'+weak.length+'問</div></button></div>';
  window._rv={ w:wrong.map(q=>q.id), k:kept.map(q=>q.id), p:weak.map(q=>q.id) };
  if(wrong.length){ html+='<div class="sec-h">間違えた問題の一覧</div>'+wrong.map(q=>revItem(q,null)).join(''); }
  html+='</div>'; $c().innerHTML=html;
}

/* ═══════════ 記録 ═══════════ */
function renderStats(){
  const ex=LS.get(K.exams,[]); const h=hist(); const o=oxh();
  let html='<div class="wrap"><h2 class="pg">📊 記録</h2><div class="pg-sub">解答数 '+Object.values(h).reduce((s,r)=>s+r.n,0)+' 回・○× '+Object.values(o).reduce((s,r)=>s+r.n,0)+' 回</div>';
  html+='<div class="sec-h">分野別（直近の解答の正答率）</div><div class="fbars">'+FORDER.map(f=>{ const s=fieldStats(f); return '<div class="fbar"><span>'+FIELDS[f].icon+' '+FIELDS[f].name+'</span><div class="tr"><div class="fl" style="width:'+(s.rate==null?0:s.rate*100)+'%;background:'+FIELDS[f].color+'"></div></div><span class="v">'+pct(s.rate)+'</span></div>'; }).join('')+'</div>';
  html+='<div class="sec-h">単元別</div><div class="fbars">'+UNITS_.map(u=>{ const s=unitStats(u.id); const r=s.tried?s.ok/s.tried:null; return '<div class="fbar" style="cursor:pointer" onclick="go(\'unit\',\''+u.id+'\')"><span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+(u.icon||'')+' '+esc(u.title)+'</span><div class="tr"><div class="fl" style="width:'+(r==null?0:r*100)+'%;background:'+FIELDS[u.field].color+'"></div></div><span class="v">'+s.ok+'/'+s.total+'</span></div>'; }).join('')+'</div>';
  html+='<div class="sec-h">試験・模試の履歴</div>';
  if(!ex.length) html+='<div class="empty">まだ記録がありません。</div>';
  else html+='<div class="tblwrap"><table class="hist"><thead><tr><th>日時</th><th>内容</th><th>得点</th>'+EXAM_ORDER.map(f=>'<th>'+FIELDS[f].name.slice(0,2)+'</th>').join('')+'<th>時間</th></tr></thead><tbody>'+ex.slice(0,50).map(e=>'<tr><td>'+fmtDate(e.t)+'</td><td>'+esc(e.title)+'</td><td><b>'+e.score+'</b>/'+e.total+'</td>'+EXAM_ORDER.map(f=>'<td>'+(e.by[f]&&e.by[f].n?e.by[f].c+'/'+e.by[f].n:'—')+'</td>').join('')+'<td>'+fmtTime(e.used)+'</td></tr>').join('')+'</tbody></table></div>';
  html+='</div>'; $c().innerHTML=html;
}

/* ═══════════ 取り込み ═══════════ */
const TEMPLATE={
  set:{ name:'令和X年度 本試験', exam:'RX' },
  questions:[
    { no:1, field:'kenri', unit:'ishi', kind:'single', polarity:'wrong',
      stem:'意思表示に関する次の記述のうち、民法の規定及び判例によれば、誤っているものはどれか。',
      choices:['肢1の文','肢2の文','肢3の文','肢4の文'], answer:3,
      why:['肢1の解説','肢2の解説','肢3の解説（これが誤り）','肢4の解説'], exp:'全体の解説（任意）' },
    { no:30, field:'gyoho', kind:'count',
      stem:'次の記述のうち、宅地建物取引業法の規定に違反するものはいくつあるか。',
      stmts:[ {t:'アの文', ok:true, why:'解説'}, {t:'イの文', ok:false, why:'解説'}, {t:'ウの文', ok:true, why:'解説'}, {t:'エの文', ok:false, why:'解説'} ],
      choices:['一つ','二つ','三つ','四つ'], answer:2, exp:'' }
  ]
};
const CONVERT_PROMPT=`次の宅建試験の問題（画像・テキスト）を、下のJSON形式に変換してください。出力はJSONだけにしてください。

形式：
{"set":{"name":"令和○年度 本試験","exam":"R○"},"questions":[ 問題オブジェクト, ... ]}

問題オブジェクトのキー：
- no：問題番号（1〜50）
- field：分野。kenri（権利関係 問1〜14）／horei（法令上の制限 問15〜22）／zei（税・価格・免除科目 問23〜25, 46〜50）／gyoho（宅建業法 問26〜45）
- unit：単元ID（わかれば。下の一覧から選ぶ。わからなければ省略）
- kind："single"（通常の4択）／"count"（個数問題・組合せ問題）
- polarity：「正しいものはどれか」なら "correct"、「誤っているものはどれか」なら "wrong"、それ以外（計算など）は省略
- stem：問題文（柱書）
- stmts：個数・組合せ問題のときだけ。[{"t":"アの文","ok":true/false,"why":"理由"}, ...]
- choices：選択肢4つの文（個数問題なら ["一つ","二つ","三つ","四つ"]）
- answer：正解の番号（1〜4）
- why：各選択肢の解説4つ（○×の理由と根拠条文・判例のポイントを1〜2文で）
- exp：全体の解説（任意）

単元IDの一覧：
${(window.UNITS||[]).map(u=>u.id+'＝'+u.title).join('、')}`;

function renderImport(){
  let html='<div class="wrap"><h2 class="pg">📥 問題の取り込み</h2><div class="pg-sub">購入した過去問などをJSONで取り込みます。取り込んだ問題は<b>この端末のブラウザの中だけ</b>に保存され、GitHubには載りません。</div>';
  html+='<div class="nbox">おすすめの流れ：問題集のページを撮影 →「変換プロンプトをコピー」して画像と一緒にClaude（Sonnetで十分）に渡す → 返ってきたJSONをここに貼る。1回で5〜10問ずつが安定します。同じセット名で取り込むと、そのセットに追加（問題番号が同じものは上書き）されます。</div>';
  html+='<div class="row" style="margin:14px 0 10px"><button class="btn sm" onclick="copyText(CONVERT_PROMPT,\'変換プロンプトをコピーしました\')">📋 変換プロンプトをコピー</button><button class="btn sm" onclick="document.getElementById(\'imp-ta\').value=JSON.stringify(TEMPLATE,null,2)">📄 見本を表示</button><label class="btn sm" style="cursor:pointer">📂 ファイルから<input type="file" accept=".json,application/json,text/plain" style="display:none" onchange="impFile(this)"></label></div>';
  html+='<textarea class="imp" id="imp-ta" placeholder="ここにJSONを貼り付け"></textarea><div class="row" style="margin-top:10px"><button class="btn p" onclick="doImport()">取り込む</button></div><div class="imp-msg" id="imp-msg"></div>';
  html+='<div class="sec-h">取り込み済みのセット</div>';
  if(!SETS.length) html+='<div class="empty">まだありません。</div>';
  SETS.forEach(s=>{ html+='<div class="list-item"><div class="li-main"><div class="li-t">'+esc(s.name)+'</div><div class="li-s">'+s.questions.length+'問　'+fmtDate(s.t||0)+'</div></div><button class="btn sm" onclick="exportSet(\''+s.id+'\')">書き出し</button><button class="btn sm danger" onclick="delSet(\''+s.id+'\')">削除</button></div>'; });
  html+='</div>'; $c().innerHTML=html;
}
function copyText(t,msg){ (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast(msg)).catch(()=>{ openModal('コピー用（長押しで全選択）','<textarea class="imp" style="min-height:320px">'+esc(t)+'</textarea>'); }); }
function impFile(inp){ const f=inp.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>{ document.getElementById('imp-ta').value=r.result; }; r.readAsText(f); }
function validateQ(q,idx){
  const e=[]; const w='問'+(q.no||'?')+'（'+(idx+1)+'件目）';
  if(!q.stem) e.push(w+'：stem（問題文）がありません');
  if(!Array.isArray(q.choices)||q.choices.length!==4) e.push(w+'：choices は4つ必要です');
  if(!(q.answer>=1&&q.answer<=4)) e.push(w+'：answer は1〜4の数字にしてください');
  if(q.field&&!FIELDS[q.field]) e.push(w+'：field が不明です（kenri/horei/zei/gyoho）');
  if(q.unit&&!UMAP[q.unit]) e.push(w+'：unit「'+q.unit+'」は存在しないので無視します（警告）');
  if(q.stmts&&!Array.isArray(q.stmts)) e.push(w+'：stmts は配列にしてください');
  return e;
}
function doImport(){
  const msg=document.getElementById('imp-msg'); let raw=document.getElementById('imp-ta').value.trim();
  raw=raw.replace(/^```(?:json)?/,'').replace(/```$/,'').trim();
  let d; try{ d=JSON.parse(raw); }catch(err){ msg.className='imp-msg err'; msg.textContent='JSONとして読めませんでした：'+err.message; return; }
  if(Array.isArray(d)) d={ set:{name:'取り込み '+new Date().toLocaleDateString()}, questions:d };
  if(!d.questions||!d.questions.length){ msg.className='imp-msg err'; msg.textContent='questions が見つかりません'; return; }
  const errs=[]; d.questions.forEach((q,i)=>errs.push(...validateQ(q,i)));
  const fatal=errs.filter(x=>!x.includes('警告'));
  if(fatal.length){ msg.className='imp-msg err'; msg.textContent='取り込めませんでした：\n'+errs.join('\n'); return; }
  const name=(d.set&&d.set.name)||'取り込み';
  const sets=loadImports(); let s=sets.find(x=>x.name===name);
  if(!s){ s={ id:'s'+Date.now().toString(36), name, exam:d.set&&d.set.exam||'', t:Date.now(), questions:[] }; sets.push(s); }
  let add=0, rep=0;
  d.questions.forEach((q,i)=>{ if(q.unit&&!UMAP[q.unit]) delete q.unit; const no=q.no; const j=no?s.questions.findIndex(x=>x.no===no):-1;
    q.id=s.id+'_'+(no||('x'+Date.now().toString(36)+i));
    if(j>=0){ q.id=s.questions[j].id; s.questions[j]=q; rep++; } else { s.questions.push(q); add++; } });
  s.questions.sort((a,b)=>(a.no||99)-(b.no||99)); s.t=Date.now();
  if(!LS.set(K.imports,sets)) return;
  rebuild(); renderImport();
  const m=document.getElementById('imp-msg'); m.className='imp-msg ok'; m.textContent='「'+name+'」に 追加 '+add+'問・上書き '+rep+'問（合計 '+s.questions.length+'問）'+(errs.length?'\n'+errs.join('\n'):'');
}
function delSet(id){ const s=SETS.find(x=>x.id===id); if(!confirm('「'+s.name+'」を削除しますか？（解答記録は残ります）')) return; LS.set(K.imports,loadImports().filter(x=>x.id!==id)); rebuild(); renderImport(); toast('削除しました'); }
function download(name,obj){ const b=new Blob([JSON.stringify(obj,null,1)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },500); }
function exportSet(id){ const s=SETS.find(x=>x.id===id); download('keystone-'+s.name+'.json',{ set:{name:s.name,exam:s.exam}, questions:s.questions.map(q=>{ const o=Object.assign({},q); delete o.id; return o; }) }); }

/* ═══════════ 設定・バックアップ ═══════════ */
function renderSettings(){
  const st=settings();
  let html='<div class="wrap"><h2 class="pg">⚙︎ 設定・バックアップ</h2><div class="pg-sub">KEYSTONE '+VERSION+'　オリジナル問題 '+(window.ORIG_Q||[]).length+'問・単元 '+UNITS_.length+'</div>';
  html+='<div class="sec-h">試験の設定</div><div class="row"><label class="ck">目標点 <input class="num" type="number" min="25" max="50" value="'+st.pass+'" onchange="saveSet({pass:+this.value})"> 点 / 50</label></div>';
  html+='<div class="row" style="margin-top:10px"><label class="ck"><input type="checkbox" '+(st.menjo?'checked':'')+' onchange="saveSet({menjo:this.checked})"> 登録講習修了者（5問免除）として解く</label></div>';
  html+='<div class="pg-sub" style="margin-top:6px">合格点は年度ごとに変わります（近年はおおむね30点台の中盤〜後半）。余裕を持った目標にしておくのがおすすめです。</div>';
  html+='<div class="sec-h">バックアップ</div><div class="wbox">iPadのSafariは、しばらく開かないサイトの保存データを消すことがあります。<b>ホーム画面に追加</b>して使い、ときどきバックアップを書き出してください（取り込んだ問題も含まれます）。</div>';
  html+='<div class="row"><button class="btn p" onclick="backup()">⬇ すべて書き出す</button><label class="btn" style="cursor:pointer">⬆ バックアップから戻す<input type="file" accept=".json" style="display:none" onchange="restore(this)"></label></div>';
  html+='<div class="sec-h">リセット</div><div class="row"><button class="btn danger" onclick="resetRec()">解答記録を消す</button><button class="btn danger" onclick="resetAll()">取り込み問題も含めてすべて消す</button></div></div>';
  $c().innerHTML=html;
}
function saveSet(p){ LS.set(K.set,Object.assign(settings(),p)); toast('保存しました'); }
function backup(){ const o={ app:'keystone', v:VERSION, at:new Date().toISOString() }; Object.values(K).forEach(k=>o[k]=LS.get(k,null)); download('keystone-backup-'+new Date().toISOString().slice(0,10)+'.json',o); }
function restore(inp){ const f=inp.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>{ try{ const o=JSON.parse(r.result); if(o.app!=='keystone') throw new Error('KEYSTONEのバックアップではありません'); if(!confirm('現在のデータを上書きして戻しますか？')) return; Object.values(K).forEach(k=>{ if(o[k]!=null) LS.set(k,o[k]); }); rebuild(); go('home'); toast('戻しました'); }catch(e){ toast(e.message,true); } }; r.readAsText(f); }
function resetRec(){ if(!confirm('解答・○×・試験の記録とキープを消します。よろしいですか？')) return; [K.hist,K.ox,K.keep,K.exams].forEach(k=>localStorage.removeItem(k)); go('home'); toast('記録を消しました'); }
function resetAll(){ if(!confirm('取り込んだ問題も含め、すべて消します。よろしいですか？')) return; Object.values(K).forEach(k=>localStorage.removeItem(k)); rebuild(); go('home'); toast('すべて消しました'); }

/* ═══════════ 起動 ═══════════ */
rebuild();
go('home');
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeModal(); });
